<link rel="icon" href="../icon.svg">

<body>
<div id="app" class="intro">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="bg"></canvas>
  <canvas id="tv"></canvas>

  <div id="top">
    <div id="badges"></div>
    <div id="year" aria-live="polite"></div>
  </div>

  <a id="home" class="ib" href="../">‹ 模樹</a>

  <section id="intro">
    <div class="hero">
      <svg class="sprout" viewBox="0 0 120 120" aria-hidden="true">
        <ellipse cx="60" cy="104" rx="34" ry="8" fill="#17405e22"/>
        <path d="M57 104 L58 62 L62 62 L63 104 Z" fill="#8a5a3b"/>
        <circle cx="40" cy="60" r="22" fill="#4c9a44"/><circle cx="80" cy="60" r="22" fill="#4c9a44"/>
        <circle cx="60" cy="40" r="28" fill="#5fb04e"/><circle cx="52" cy="32" r="10" fill="#8fd16a"/>
        <circle cx="46" cy="54" r="4" fill="#f2a531"/><circle cx="72" cy="38" r="4" fill="#e46f2a"/><circle cx="78" cy="62" r="4" fill="#f2a531"/>
      </svg>
      <h1>許願這裡<br>有一棵樹</h1>
    </div>
    <button id="go" class="btn big" type="button">開相機許願</button>
  </section>

  <div id="hint" class="chip"></div>

  <section id="pick">
    <div id="cards" role="listbox" aria-label="樹種"></div>
    <button id="shut" type="button" aria-label="種下並拍照"><span class="core"></span></button>
  </section>


  <div id="flash"></div>

  <section id="done" aria-live="polite">
    <div class="sheet">
      <div class="photo"><img id="photo" alt="許願照片"><div id="gain"><b>+30</b> 點</div></div>
      <div class="row"><h2>許好了</h2><div id="dbadges"></div></div>
      <div id="total" class="total"></div>
      <div class="prog">
        <div class="pl"><span>這一格的許願</span><b id="pn"></b></div>
        <div class="bar"><i id="pb"></i></div>
      </div>
      <div class="acts">
        <button id="again" class="btn" type="button">再許一棵</button>
        <div class="two">
          <a class="btn w" href="../../#/f/wish-map">看許願地圖</a>
          <a class="btn w" href="../redeem.html">去兌換</a>
        </div>
        <a id="vote" href="https://puma.taipei/hackathon/vote" target="_blank" rel="noopener">🗳 喜歡就投一票</a>
      </div>
    </div>
  </section>
</div>
