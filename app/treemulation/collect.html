<html lang="zh-Hant-TW">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#6cc8ff">
<title>模樹 Treemulation・收集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 換皮只要改這一段（目前：明亮圓潤戶外冒險） */
:root{
  --sky:#6cc8ff; --sky2:#c9ecff; --grass:#9bdc6e; --grass2:#7cc653; --leaf:#2e9e5b; --navy:#17405e; --sun:#ffcd2e; --sun2:#e8a300;
  --card:#ffffff; --mute:#5d7f97; --shadow:#17405e22;
  --accent:var(--sun); --ink:var(--navy);
  --r-first:#ffcd2e;   /* 首拍：從沒人拍過 */
  --r-long:#ff6fb5;    /* 久違：一年以上沒人拍 */
  --r-rare:#3fb6ff;    /* 少見：100 天以上 */
  --r-common:#8fe06a;  /* 常見 */
  --round:"Huninn","M PLUS Rounded 1c","Noto Sans TC",system-ui,sans-serif; --num:"Fredoka","Huninn",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#dff3ff;color:var(--navy);font-family:var(--round);overscroll-behavior:none}
body{display:grid;place-items:center;overflow:hidden}
#app{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#9ab;touch-action:none;user-select:none;-webkit-user-select:none}
@media (min-width:600px){#app{width:390px;height:min(844px,96vh);border-radius:40px;box-shadow:0 30px 80px #17405e40,0 0 0 8px #fff}}
#video,#bg,#ov,#freeze,#fx{position:absolute;inset:0;width:100%;height:100%}
#video{object-fit:cover;display:none;background:#000}
#app.cam #video{display:block}#app.cam #bg{display:none}
#ov,#fx{pointer-events:none}#fx{z-index:27}
#freeze{display:none;z-index:20}
.badge{display:inline-flex;align-items:center;gap:3px;font:700 11px/1 var(--round);padding:5px 9px;border-radius:99px;background:#fff;color:var(--mute);white-space:nowrap;box-shadow:0 3px 0 var(--shadow)}
.badge.hot{background:var(--sun);color:var(--navy)}
.badge b{font:600 11px var(--num)}
.pill{display:inline-flex;align-items:center;font:700 10.5px/1 var(--round);padding:3px 7px;border-radius:99px;background:#eaf3f8;color:var(--mute);white-space:nowrap}

/* 頂部 */
#top{position:absolute;left:0;right:0;top:0;z-index:16!important;padding:calc(12px + env(safe-area-inset-top)) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:10;pointer-events:none}
#topl{display:flex;gap:8px;align-items:flex-start;min-width:0}#topl #back{pointer-events:auto;flex:none}
#badges{display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
#topr{display:flex;gap:8px;pointer-events:auto}
.ib{appearance:none;cursor:pointer;height:40px;min-width:40px;padding:0 14px;border-radius:99px;border:0;background:#fff;color:var(--navy);font:800 13px/1 var(--round);display:grid;place-items:center;text-decoration:none;box-shadow:0 4px 0 var(--shadow)}
.ib svg{width:18px;height:18px}
#sound{padding:0}
#sound.off .on{display:none}#sound:not(.off) .x{display:none}

/* 準星 */
#ret{display:none;position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;pointer-events:none;z-index:5;border:3px dashed #ffffffb0;border-radius:24px}

/* 底部 */
#bot{position:absolute;left:0;right:0;bottom:0;padding:0 12px calc(22px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;z-index:10;pointer-events:none}
#tinfo{pointer-events:none;align-self:end;background:#fff;border-radius:22px;padding:9px 12px 10px;box-shadow:0 5px 0 var(--shadow);font:700 12px/1.35 var(--round);justify-self:start;min-width:0}
#tinfo:empty{display:none}
#tinfo b{display:block;font:800 17px/1.15 var(--round)}
#tinfo .d{font:600 14px var(--num)}
#tinfo .rar{display:inline-block;margin-top:5px;font:800 11px/1 var(--round);padding:4px 8px;color:var(--navy);border-radius:99px}
#shut{pointer-events:auto;appearance:none;cursor:pointer;width:88px;height:88px;border-radius:50%;border:0;padding:0;position:relative;background:none;display:none;touch-action:none}
#shut .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--sun) calc(var(--p,0)*360deg),#ffffffaa 0);
  -webkit-mask:radial-gradient(circle,transparent 36px,#000 37px);mask:radial-gradient(circle,transparent 36px,#000 37px)}
#shut .core{position:absolute;inset:9px;border-radius:50%;background:#fff;box-shadow:0 5px 0 #c6dce9;transition:transform .12s,background .2s}
#shut .tm{position:absolute;inset:0;border-radius:50%;border:5px solid var(--sun);opacity:0;pointer-events:none}
#shut.charging .tm{animation:shrink .8s linear forwards}
@keyframes shrink{0%{transform:scale(2.1);opacity:.25;border-color:#fff}70%{opacity:1;border-color:var(--sun)}100%{transform:scale(.98);opacity:1}}
#shut.charging .core{transform:scale(.9)}
#shut.full .ring{filter:drop-shadow(0 0 10px var(--sun))}
#shut.full .core{background:var(--sun);box-shadow:0 5px 0 var(--sun2)}
#shut.off .core{background:#ffffffb0;box-shadow:none}
#go{pointer-events:auto;appearance:none;cursor:pointer;border:0;border-radius:99px;height:62px;padding:0 30px;font:900 20px/1 var(--round);color:var(--navy);background:var(--sun);box-shadow:0 6px 0 var(--sun2),0 12px 24px #e8a30044;white-space:nowrap}
#go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sun2)}
#app.started #shut{display:block}
#intro{position:absolute;inset:0;z-index:15;background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 38%,#effaff 70%,#e6f7da 100%);display:flex;flex-direction:column;justify-content:center;padding:calc(66px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;touch-action:pan-y}
#app.started #intro{display:none}
#intro .brand{font:700 14px/1 var(--num);color:#fff;letter-spacing:.02em;text-shadow:0 2px 0 #17405e30}
#intro h1{margin:8px 0 0;font:900 32px/1.25 var(--round);color:var(--navy)}
.tcard{margin-top:18px;background:#fff;border-radius:28px;padding:14px 16px;box-shadow:0 7px 0 var(--shadow);display:grid;grid-template-columns:76px 1fr;gap:4px 14px;align-items:center}
.tcard .ic{grid-row:1/4;width:76px;height:76px;border-radius:22px;background:#fff8dc;display:grid;place-items:center}
.tcard .ic svg{width:58px;height:58px;filter:drop-shadow(0 0 8px var(--rc))}
.tcard .k{font:800 12px/1 var(--round);color:var(--mute)}
.tcard b{font:900 26px/1.1 var(--round)}
.tcard .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tcard .d{font:700 18px/1 var(--num)}
.tcard .p{font:700 15px/1 var(--num);background:var(--sun);border-radius:99px;padding:5px 10px;box-shadow:0 3px 0 var(--sun2)}
.tcard .r{font:800 12px/1 var(--round);border-radius:99px;padding:5px 9px;background:var(--rc)}
.steps{list-style:none;margin:22px 0 0;padding:0;display:flex;align-items:center;justify-content:space-between;gap:4px}
.steps li{display:flex;flex-direction:column;align-items:center;gap:6px;font:800 14px/1 var(--round);color:var(--navy)}
.steps .si{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 var(--shadow);color:var(--leaf)}
.steps .si svg{width:28px;height:28px}
.steps .ar{flex:1;height:0;border-top:3px dotted #17405e40;margin:0 2px 20px}
#entry{margin-top:34px;display:grid;gap:14px}
#entry>*{width:100%;height:62px;appearance:none;cursor:pointer;border:0;border-radius:99px;font:900 19px/1 var(--round);color:var(--navy);background:#fff;box-shadow:0 6px 0 #c6dce9,0 12px 24px #17405e22;display:flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;text-decoration:none}
#entry>.rec{background:var(--sun);box-shadow:0 6px 0 var(--sun2),0 12px 24px #e8a30044}
#entry>*:active{transform:translateY(4px)}
#entry svg{width:24px;height:24px;flex:none}
#tbar{position:absolute;left:12px;right:12px;top:calc(60px + env(safe-area-inset-top));z-index:10;display:none;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-radius:22px;padding:10px 10px 10px 16px;box-shadow:0 5px 0 var(--shadow);font:800 14px/1.25 var(--round);color:var(--navy)}
#app.started #tbar{display:flex}
#tbar #tbs{flex:none;font:900 13px/1 var(--round);border-radius:99px;padding:8px 11px;background:#eaf3f8;color:var(--navy)}
#tbar #tbs.ok{background:var(--grass);box-shadow:0 3px 0 var(--grass2)}
#shutlab{display:none;margin-top:8px;font:900 14px/1 var(--round);color:var(--navy);background:#fff;border-radius:99px;padding:6px 12px;box-shadow:0 3px 0 var(--shadow)}
#app.started #shutlab{display:block}
#tinfo{visibility:hidden!important}
#app:not(.started) #badges,#app:not(.started) .redeem:not(.in){display:none}

#dexbtn{pointer-events:auto;justify-self:end;appearance:none;cursor:pointer;border:0;background:#fff;color:var(--navy);border-radius:22px;width:66px;height:66px;display:grid;place-items:center;align-content:center;gap:3px;box-shadow:0 5px 0 var(--shadow)}
#dexbtn .ic{width:30px;height:30px;border-radius:50%;background:var(--leaf);display:grid;place-items:center}
#dexbtn .ic svg{width:18px;height:18px}
#dexbtn b{font:700 15px/1 var(--num)}
#dexbtn.bump{animation:bump .5s cubic-bezier(.2,1.6,.3,1)}
@keyframes bump{40%{transform:scale(1.3)}}
.redeem{position:absolute;right:12px;bottom:calc(104px + env(safe-area-inset-bottom));z-index:11;display:flex;align-items:center;gap:6px;height:42px;padding:0 14px 0 5px;border-radius:99px;background:var(--sun);color:var(--navy);text-decoration:none;font:900 15px/1 var(--round);box-shadow:0 5px 0 var(--sun2)}
.redeem .ic{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--sun2);font-size:18px}
.redeem b{font:700 17px/1 var(--num)}.redeem small{font:800 11px var(--round);margin-left:-3px}
.redeem.in{position:static;height:40px}
.redeem:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun2)}
#credit{position:absolute;left:0;right:0;bottom:4px;text-align:center;font:600 9px/1 var(--round);color:#ffffffcc;z-index:9;pointer-events:none;text-shadow:0 1px 2px #0006}

#toast{position:absolute;left:50%;top:auto;bottom:calc(215px + env(safe-area-inset-bottom));transform:translate(-50%,-50%) scale(.9);opacity:0;transition:.25s cubic-bezier(.2,1.5,.3,1);z-index:40;pointer-events:none;
  font:800 15px/1.3 var(--round);color:var(--navy);background:#fff;padding:11px 18px;border-radius:99px;white-space:nowrap;box-shadow:0 5px 0 var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* 收集瞬間 */
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
#scan{position:absolute;inset:0;z-index:21;pointer-events:none;display:none}
#scan .bar{position:absolute;left:0;right:0;height:4px;top:0;background:var(--sun);box-shadow:0 0 18px 6px #ffcd2eaa}
#scan .bar::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:90px;background:linear-gradient(0deg,#ffcd2e55,transparent)}
#scan.run .bar{animation:sweep .7s linear forwards}
@keyframes sweep{from{top:0}to{top:100%}}
#scan .box{position:absolute;border:4px dashed #fff;border-radius:24px}
#scan .txt{position:absolute;left:50%;top:-20px;transform:translateX(-50%);font:800 14px/1 var(--round);color:var(--navy);background:#fff;padding:9px 14px;border-radius:99px;white-space:nowrap;box-shadow:0 4px 0 var(--shadow)}
#rays{position:absolute;left:50%;top:44%;width:900px;height:900px;margin:-450px 0 0 -450px;z-index:22;pointer-events:none;opacity:0;transition:opacity .4s;
  background:repeating-conic-gradient(from 0deg,var(--rc) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);animation:spin 14s linear infinite}
#rays.show{opacity:.55}
#dim{position:absolute;inset:0;z-index:21;background:#17405e;opacity:0;pointer-events:none;transition:opacity .4s}
#dim.show{opacity:.35}
@keyframes spin{to{transform:rotate(360deg)}}
#card,.vc{position:absolute;left:0;top:0;z-index:25;display:none;transform-origin:0 0;perspective:900px}
.vc{position:relative;display:block}
#card .in,.vc .in{width:100%;height:100%;border-radius:26px;padding:8px;background:#fff;box-shadow:0 8px 0 #c6dce9,0 24px 50px #17405e55;display:flex;flex-direction:column;position:relative;animation:tilt 3.2s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotateY(-6deg) rotateX(3deg)}50%{transform:rotateY(6deg) rotateX(-2deg)}}
.ph{flex:1;border-radius:20px;background:#9ab center/cover no-repeat;position:relative;overflow:hidden;border:4px solid var(--rc)}
.ph::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
  background:linear-gradient(115deg,transparent 30%,#ffffffcc 44%,#ffd6f0aa 50%,#c9f0ffaa 56%,transparent 70%);background-size:260% 100%;animation:holo 2.4s linear infinite}
@keyframes holo{from{background-position:120% 0}to{background-position:-60% 0}}
.rk{position:absolute;left:8px;top:8px;font:800 13px/1 var(--round);color:var(--navy);background:var(--rc);padding:6px 11px;border-radius:99px;box-shadow:0 3px 0 #17405e30;z-index:1}
.spn{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;border:2.5px solid var(--sc);z-index:1}
.spn svg{width:20px;height:20px}
.meta{padding:10px 8px 4px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:end;color:var(--navy)}
.meta h3{margin:0;font:800 24px/1.1 var(--round)}
.meta .pt{grid-row:1/3;grid-column:2;font:700 26px/1 var(--num);color:var(--navy);background:var(--sun);border-radius:99px;padding:8px 14px;box-shadow:0 4px 0 var(--sun2)}
.meta .id{font:600 11px/1.4 var(--num);color:var(--mute)}
.meta .bd{grid-column:1/3;display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
#card.lift{transition:transform .55s cubic-bezier(.2,1.3,.3,1),width .55s cubic-bezier(.2,.9,.25,1),height .55s cubic-bezier(.2,.9,.25,1)}
#card.fly{transition:transform .6s cubic-bezier(.6,0,.3,1),opacity .6s}
#card .meta,#card .rk,#card .spn{opacity:0;transition:opacity .35s .25s}
#card.ready .meta,#card.ready .rk,#card.ready .spn{opacity:1}
#gain{position:absolute;left:0;right:0;z-index:26;text-align:center;pointer-events:none;opacity:0;display:flex;flex-direction:column;align-items:center;gap:7px}
#gain .big{font:800 16px/1 var(--round);color:var(--navy);background:#fff;border-radius:99px;padding:9px 16px;box-shadow:0 4px 0 var(--shadow)}
#gain .sp{display:inline-flex;align-items:center;gap:6px;font:800 12.5px/1 var(--round);background:#fff;color:var(--sc);border:2.5px solid var(--sc);padding:4px 8px 4px 4px;border-radius:99px}
#gain .sp i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
#gain .sp svg{width:16px;height:16px}
#gain.show{opacity:1;transition:opacity .3s}
#done{position:absolute;left:16px;right:16px;bottom:calc(26px + env(safe-area-inset-bottom));z-index:26;display:none;gap:10px}
#done.show{display:flex}
.twin{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom));z-index:26;display:none;font:800 13px/1 var(--round);color:var(--navy);background:#fff;border-radius:99px;padding:10px 14px;text-decoration:none;box-shadow:0 4px 0 var(--shadow);white-space:nowrap}
.twin::after{content:"";display:inline-block;width:7px;height:7px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(45deg);margin-left:7px;vertical-align:1px}
.twin.show{display:block}
#twin{left:16px;transform:none}#vote{left:auto;right:16px;transform:none;background:var(--sun);box-shadow:0 4px 0 var(--sun2)}.twin.show+#vote{display:block} /* 兩顆並排在按鈕列上方，不壓到點數說明 */
#view{grid-auto-flow:row;align-content:center;gap:14px}
#view .twin{position:static;transform:none;display:inline-block;justify-self:center}
.btn{flex:1;appearance:none;cursor:pointer;border:0;font:900 18px var(--round);color:var(--navy);background:var(--sun);border-radius:99px;height:58px;padding:0 18px;box-shadow:0 6px 0 var(--sun2);white-space:nowrap}
.btn.w{background:#fff;box-shadow:0 6px 0 #c6dce9}
.btn:active{transform:translateY(4px)}

/* 圖鑑 */
#dex{position:absolute;inset:0;z-index:50;background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 26%,#eef9ff 60%);display:none;flex-direction:column;touch-action:pan-y}
#dex.open{display:flex}
#dex header{padding:calc(14px + env(safe-area-inset-top)) 14px 8px}
#dex .hrow{display:flex;justify-content:space-between;align-items:center}
#dex h2{margin:0;font:900 28px/1.1 var(--round);color:#fff;text-shadow:0 3px 0 #17405e30}
#dex .pbox{margin-top:10px;background:#fff;border-radius:24px;padding:12px 14px;box-shadow:0 6px 0 var(--shadow)}
#dex .prog{display:flex;align-items:baseline;gap:6px}
#dex .prog b{font:700 34px/1 var(--num);color:var(--leaf)}
#dex .prog span.t{font:600 16px var(--num);color:var(--mute)}
#dex .prog em{font-style:normal;font:800 15px var(--round);margin-right:4px}
#dex .barw{height:12px;background:#e7eef3;margin-top:8px;border-radius:99px;overflow:hidden}
#dex .barw i{display:block;height:100%;background:var(--grass2);border-radius:99px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;cursor:pointer;flex:none;font:800 12.5px/1 var(--round);padding:8px 12px;border-radius:99px;border:0;background:#fff;color:var(--navy);box-shadow:0 3px 0 var(--shadow)}
.chip.on{background:var(--navy);color:#fff}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
#dex select{font:800 12.5px var(--round);background:#fff;color:var(--navy);border:0;border-radius:99px;padding:7px 10px;flex:none;box-shadow:0 3px 0 var(--shadow)}
#prize{display:flex;align-items:center;gap:8px;margin-top:10px;font:800 12.5px/1.3 var(--round)}
#prize:empty{display:none}
#prize i{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;border:2.5px solid var(--sc)}
#prize svg{width:18px;height:18px}
#grid{flex:1;overflow-y:auto;padding:8px 14px calc(20px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:var(--cellh,150px);gap:10px;align-content:start}
.dc{position:relative;display:block;width:100%;height:100%;border-radius:18px;overflow:hidden;border:0;background:#fff;cursor:pointer;padding:5px;appearance:none;color:var(--navy);text-align:left;box-shadow:0 5px 0 var(--shadow)}
.dc .f{position:absolute;inset:5px 5px 34px;border-radius:13px;background:center/cover no-repeat;border:3px solid var(--rc)}
.dc .n{position:absolute;left:8px;right:6px;bottom:6px;font:800 12.5px/1.1 var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc .n small{display:block;font:600 8.5px var(--num);color:var(--mute)}
.dc .r{position:absolute;right:10px;bottom:12px;width:10px;height:10px;border-radius:50%;background:var(--rc)}
.dc .s{position:absolute;left:10px;top:10px}

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const app=$('#app'), video=$('#video'), bg=$('#bg'), ov=$('#ov'), frz=$('#freeze'), fx=$('#fx');
const bctx=bg.getContext('2d'), octx=ov.getContext('2d'), fctx=frz.getContext('2d'), xctx=fx.getContext('2d');
const D2R=Math.PI/180, EYE=1.5, REACH=15;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const store={get(k,d){try{const v=localStorage.getItem('tt.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('tt.'+k,JSON.stringify(v));}catch(e){}}};
const buzz=p=>{try{if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))navigator.vibrate(p);}catch(e){}};
const norm=a=>((a%360)+360)%360, adiff=(a,b)=>((a-b+540)%360)-180;

/* ---------- 稀有度（點數與天數為模擬） ---------- */
const RAR={first:{n:'首拍',v:'--r-first'},long:{n:'久違',v:'--r-long'},rare:{n:'少見',v:'--r-rare'},common:{n:'常見',v:'--r-common'}};
const rarOf=t=>t.days<0?'first':t.days>=365?'long':t.days>=100?'rare':'common';
const ptsOf=t=>t.days<0?50:10+Math.min(40,Math.floor(t.days/10));
let RC={}; function readColors(){for(const k in RAR) RC[k]=css(RAR[k].v);} readColors();

/* ---------- 贊助（虛構企業） ---------- */
const LOGO={
  yexi:c=>`<svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="6" fill="none" stroke="${c}" stroke-width="2.6"/><rect x="4" y="19" width="16" height="2.6" fill="${c}"/></svg>`,
  luling:c=>`<svg viewBox="0 0 24 24"><path d="M5 19C5 10 11 4 20 4c0 9-6 15-15 15z" fill="${c}"/><path d="M5 19L14 10" stroke="#fff" stroke-width="1.6"/></svg>`,
  shufang:c=>`<svg viewBox="0 0 24 24"><rect x="4.5" y="4" width="6.5" height="16" fill="none" stroke="${c}" stroke-width="2.4"/><rect x="13" y="4" width="6.5" height="16" fill="none" stroke="${c}" stroke-width="2.4"/></svg>`,
};
const CO={
  yexi:{name:'葉隙光電',c:'#d9822b',logo:'yexi',prize:'環保隨行杯',cost:150},
  luling:{name:'綠廊人壽',c:'#3d7ea6',logo:'luling',prize:'樹苗認領券（台灣原生種）',cost:100},
  shufang:{name:'蔭下書屋',c:'#8a5a9e',logo:'shufang',prize:'蔭下書屋咖啡兌換券',cost:60},
};
const SPONSOR={'信義路二段':CO.yexi,'和平東路一段':CO.yexi,'永康公園':CO.luling,'泰順公園':CO.luling,'金杭公園':CO.shufang,'錦安公園':CO.shufang};
const SP_BONUS=10;
const spOf=t=>SPONSOR[t.place]||null, logo=s=>LOGO[s.logo](s.c);

/* ---------- 狀態 ---------- */
const S={trees:[],home:null,pos:{x:0,y:0},posT:null,simPos:true,acc:0,target:null,started:false,cam:false,
  q:null,qT:null,sensor:false,yawOff:0,yawOffT:null,compass:null,anchored:false,dragYaw:0,dragPitch:0,
  busy:false,charge:0,charging:false,collected:new Map(),place:null};
if(/[?&]debug/.test(location.search)) window.__S=S;
let LAT0=25.03,LNG0=121.53,MX=1,MY=110574, BBOX=null;
const toXY=(lat,lng)=>({x:(lng-LNG0)*MX,y:(lat-LAT0)*MY});

/* ---------- 尺寸與鏡頭 ---------- */
let W=390,H=844,DPR=1,F=600;
function resize(){const r=app.getBoundingClientRect();W=r.width;H=r.height;DPR=Math.min(2,devicePixelRatio||1);
  for(const c of [bg,ov,frz,fx]){c.width=W*DPR;c.height=H*DPR;}
  F=camF();
  panoDirty=true;}
let panoDirty=true; addEventListener('resize',resize);
// 焦距要跟「實際顯示的相機畫面」一致，不然轉手機時光點移動速度跟背景不同、看起來在滑。
// 相機畫面用 object-fit:cover 會被裁切：以影片實際尺寸×縮放倍率算；主鏡頭錄影長邊視角約 64°（估計值）
function camF(){ const vw=video&&video.videoWidth, vh=video&&video.videoHeight;
  if(!S.cam||!vw||!vh) return (H/2)/Math.tan(34*D2R);
  const s=Math.max(W/vw,H/vh); return (Math.max(vw,vh)*s/2)/Math.tan(32*D2R); }

/* ---------- 姿態：四元數（裝置座標 → 地面座標，W3C 的 Z-X'-Y'' 順序） ---------- */
function qmul(a,b){return[a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];}
function qEuler(al,be,ga){const h=x=>x*D2R/2; const z=[Math.cos(h(al)),0,0,Math.sin(h(al))], x=[Math.cos(h(be)),Math.sin(h(be)),0,0], y=[Math.cos(h(ga)),0,Math.sin(h(ga)),0]; return qmul(qmul(z,x),y);}
function qlerp(a,b,t){let d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3]; const s=d<0?-1:1; const r=a.map((v,i)=>v+(s*b[i]-v)*t); const n=Math.hypot(...r); return r.map(v=>v/n);}
function qmat(q){const[w,x,y,z]=q;return[[1-2*(y*y+z*z),2*(x*y-w*z),2*(x*z+w*y)],[2*(x*y+w*z),1-2*(x*x+z*z),2*(y*z-w*x)],[2*(x*z-w*y),2*(y*z+w*x),1-2*(x*x+y*y)]];}
let R=qmat(qEuler(0,90,0));
const camHeading=()=>norm(Math.atan2(-R[0][2],-R[1][2])/D2R);   // 鏡頭（手機背面）水平方位，相對座標
const camPitch=()=>Math.asin(Math.max(-1,Math.min(1,-R[2][2])))/D2R;
const camRoll=()=>Math.atan2(R[2][0],R[2][1]);

// 世界座標（公尺，東/北/上）→ 螢幕
function proj(ex,ny,up){
  const o=S.yawOff*D2R, x=ex*Math.cos(o)+ny*Math.sin(o), y=ny*Math.cos(o)-ex*Math.sin(o);
  const dx=R[0][0]*x+R[1][0]*y+R[2][0]*up, dy=R[0][1]*x+R[1][1]*y+R[2][1]*up, dz=R[0][2]*x+R[1][2]*y+R[2][2]*up;
  const z=-dz; return {z, sx:W/2+dx/z*F+(S.offX||0), sy:H/2-dy/z*F+(S.offY||0)};
}
const rel=t=>({ex:t.x-S.pos.x, ny:t.y-S.pos.y});
const distOf=t=>Math.hypot(t.x-S.pos.x,t.y-S.pos.y);
const bearingOf=t=>norm(Math.atan2(t.x-S.pos.x,t.y-S.pos.y)/D2R);

function anchor(){ // 把目標樹放在鏡頭正前方
  if(!S.target) return; S.yawOff=adiff(camHeading(),bearingOf(S.target)); S.anchored=true; panoDirty=true;
}

/* ---------- 感測器 ---------- */
function screenAngle(){return (screen.orientation&&screen.orientation.angle)||window.orientation||0}
function backHeading(a,b,g){ if(b==null||g==null) return norm(360-a);
  const cA=Math.cos(a*D2R),sA=Math.sin(a*D2R),sB=Math.sin(b*D2R),cG=Math.cos(g*D2R),sG=Math.sin(g*D2R);
  const rA=-cA*sG-sA*sB*cG, rB=-sA*sG+cA*sB*cG; let h=Math.atan(rA/rB); if(rB<0)h+=Math.PI; else if(rA<0)h+=2*Math.PI; return norm(h/D2R);}
function onOri(e){
  if(e.type==='deviceorientation' && e.alpha!=null){ S.qT=qEuler(e.alpha,e.beta||0,e.gamma||0); if(!S.sensor){S.sensor=true; S.needAnchor=true; setBadges();} }
  let hc=null;
  if(typeof e.webkitCompassHeading==='number'&&!isNaN(e.webkitCompassHeading)) hc=e.webkitCompassHeading;
  else if(e.type==='deviceorientationabsolute'&&e.absolute&&e.alpha!=null) hc=backHeading(e.alpha,e.beta,e.gamma);
  if(hc!=null){ S.compass=norm(hc+screenAngle()); if(!S.sensor && e.type==='deviceorientationabsolute'){ S.qT=qEuler(e.alpha,e.beta||0,e.gamma||0); } }
}
function absMode(){return !S.simPos && S.compass!=null}

/* ---------- 沒有相機時：像對焦中的相機畫面（模糊色塊＋雜訊） ---------- */
const PX=8; let pano=null, panoMid=null, panoOne=1, PPD=10; // pixels per degree（全尺寸）
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)}
function buildPano(){
  PPD=F*D2R; const SW=Math.round(360*PPD/PX), SH=Math.round(150*PPD/PX), hz=SH/2;
  const c=document.createElement('canvas'); c.width=SW; c.height=SH; const x=c.getContext('2d');
  let g=x.createLinearGradient(0,0,0,hz); g.addColorStop(0,'#8fc6ea'); g.addColorStop(.7,'#cfe6f2'); g.addColorStop(1,'#efeee6'); x.fillStyle=g; x.fillRect(0,0,SW,hz);
  g=x.createLinearGradient(0,hz,0,SH); g.addColorStop(0,'#7c7f78'); g.addColorStop(.25,'#5e605a'); g.addColorStop(1,'#33352f'); x.fillStyle=g; x.fillRect(0,hz,SW,SH-hz);
  const col=b=>norm(b)/360*SW, ppd=PPD/PX;
  for(let a=0;a<360;a+=2.5){ const h=(6+hash(a)*16)*ppd, w=2.6*ppd; const tone=150+hash(a+7)*70|0;
    x.fillStyle=`rgb(${tone},${tone-6},${tone-14})`; x.fillRect(col(a),hz-h,w,h); if(hash(a+3)>.6){x.fillStyle='rgba(60,70,80,.5)'; x.fillRect(col(a)+w*.2,hz-h*.7,w*.5,h*.15);} }
  // 真實樹木位置畫成模糊樹冠（方位與鏡頭一致，光點會落在綠色上）
  const near=S.trees.map(t=>({t,d:distOf(t)})).filter(o=>o.d<80&&o.d>1).sort((a,b)=>b.d-a.d);
  for(const {t,d} of near){ const b=bearingOf(t)+S.yawOff, h=Math.min(16,t.height||6), cr=Math.max(1.4,h*.32);
    const xc=col(b), top=hz-Math.atan2(h-EYE,d)/D2R*ppd, base=hz+Math.atan2(EYE,d)/D2R*ppd, rw=Math.atan2(cr,d)/D2R*ppd;
    x.fillStyle='rgba(58,48,38,.85)'; x.fillRect(xc-Math.max(.6,rw*.12),top+rw,Math.max(1.2,rw*.24),base-top-rw);
    const gg=40+hash(d)*40|0; x.fillStyle=`rgba(${gg+20},${gg+70},${gg+10},.92)`; x.beginPath(); x.ellipse(xc,top+rw*.7,rw*1.1,rw*.9,0,0,7); x.fill();
    x.fillStyle=`rgba(${gg+60},${gg+110},${gg+40},.6)`; x.beginPath(); x.ellipse(xc-rw*.3,top+rw*.4,rw*.6,rw*.45,0,0,7); x.fill(); }
  for(let i=0;i<40;i++){ const a=hash(i*3.3)*360, cc=['#b5463c','#d6b34a','#2f5d8a','#e8e8e8','#222'][i%5]; x.fillStyle=cc; x.globalAlpha=.6; x.beginPath(); x.ellipse(col(a),hz+(2+hash(i)*10)*ppd,(1+hash(i+1)*2)*ppd,(.5+hash(i+2))*ppd,0,0,7); x.fill(); }
  x.globalAlpha=1;
  // 兩段放大＝高斯感的模糊
  // 左右接成一圈再放大，避免接縫
  const w3=document.createElement('canvas'); w3.width=SW*3; w3.height=SH; const w3x=w3.getContext('2d'); for(let i=0;i<3;i++) w3x.drawImage(c,i*SW,0);
  const m=document.createElement('canvas'); m.width=SW*3*2; m.height=SH*2; const mx=m.getContext('2d'); mx.imageSmoothingQuality='high'; mx.drawImage(w3,0,0,m.width,m.height);
  panoMid=m; panoOne=SW*2; panoDirty=false;
}
const noise=(()=>{const c=document.createElement('canvas'); c.width=c.height=160; const x=c.getContext('2d'), im=x.createImageData(160,160);
  for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=28;} x.putImageData(im,0,0); return c;})();
let lastHead=0;
function drawFakeCam(){
  if(panoDirty) buildPano();
  const c=bctx; c.setTransform(DPR,0,0,DPR,0,0); c.fillStyle='#555'; c.fillRect(0,0,W,H);
  const k=4, ppd=PPD/k, PW=panoOne, PH=panoMid.height; const hd=camHeading(), pt=camPitch();
  const vel=adiff(hd,lastHead); lastHead=hd;
  c.save(); c.translate(W/2,H/2); c.rotate(camRoll()); c.scale(k,k); c.imageSmoothingQuality='high';
  const cx=hd/360*PW, cy=PH/2-pt*ppd;
  const passes=Math.abs(vel)>.6&&!reduce?[-1,0,1]:[0];
  for(const p of passes){ c.globalAlpha=passes.length>1?.4:1; const ox=-cx+p*vel*ppd*.6;
    c.drawImage(panoMid,ox-PW,-cy); }
  c.restore(); c.globalAlpha=1;
  const v=c.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.75); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.38)'); c.fillStyle=v; c.fillRect(0,0,W,H);
  c.globalCompositeOperation='overlay'; const ox=Math.random()*160|0, oy=Math.random()*160|0;
  for(let x=-ox;x<W;x+=160) for(let y=-oy;y<H;y+=160) c.drawImage(noise,x,y);
  c.globalCompositeOperation='source-over';
}

/* ---------- 光點、光圈、粒子 ---------- */
const motes=[];
function drawOverlay(t){
  const c=octx; c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,W,H);
  if(!S.trees.length) return;
  const list=[]; for(const tr of S.trees){const d=distOf(tr); if(d<70) list.push({tr,d});}
  list.sort((a,b)=>b.d-a.d);
  S.hits=[]; let tgtScreen=null; const L=[];
  const slot=(cx,ly,w)=>{ for(let i=0;i<5;i++){ if(!L.some(b=>Math.abs(b.cx-cx)<(b.w+w)/2+8&&Math.abs(b.y-ly)<26)) break; ly+=28; } L.push({cx,y:ly,w}); return ly; }; // 標籤互相讓位
  for(const {tr,d} of list){

  const want=new URLSearchParams(location.search).get('tree'), wt=want&&S.trees.find(t=>t.id===want);
  if(wt&&!S._usedWant&&S.target!==wt){ S._usedWant=true; S.target=wt; setInfo(); return; }
  let best=null,bd=1e9; for(const t of S.trees){ if(t.days>=0||S.collected.has(t.id)) continue; const d=distOf(t); if(d<bd){bd=d;best=t;} }
  S.target=best||(RETAKE&&wt)||null; setInfo(); // 示範：附近只剩拍過的指定樹時，留著它重拍
}

/* ---------- 拖曳：沒有陀螺儀就用手指看四周；有陀螺儀時微調左右 ---------- */
let drag=null, moved=false;
app.addEventListener('pointerdown',e=>{sfx.unlock(); if(e.target.closest('button,a,#dex,#view,#card')) return; drag={x:e.clientX,y:e.clientY}; moved=false;});
addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>4) moved=true; drag={x:e.clientX,y:e.clientY};
  const dd=dx/F/D2R; if(S.sensor){ S.offX=(S.offX||0)+dx; S.offY=(S.offY||0)+dy; } else { S.dragYaw-=dd; S.dragPitch=Math.max(-50,Math.min(50,S.dragPitch+dy/F/D2R)); } });
addEventListener('pointerup',e=>{ const was=drag; drag=null; if(!was||moved||S.busy) return;
  // 點光點：換目標；模擬位置時直接走過去
  const h=(S.hits||[]).filter(h=>Math.hypot(h.x-e.clientX+app.getBoundingClientRect().left,h.y-e.clientY+app.getBoundingClientRect().top)<h.r).sort((a,b)=>distOf(a.tr)-distOf(b.tr))[0];
  if(!h){ // 點畫面上真的那棵樹：目標光點移過去（錄影對準用）
    const t=S.tgtScreen; if(!S.started||!S.target||!t) return;
    const r=app.getBoundingClientRect(), tx=e.clientX-r.left, ty=e.clientY-r.top;
    S.offX=(S.offX||0)+(tx-t.x); S.offY=(S.offY||0)+(ty-t.y); sfx.scan(2); toast('對準了'); return; }
  S.target=h.tr; setInfo(); sfx.scan(2);
  if(S.simPos && distOf(h.tr)>REACH){ const b=bearingOf(h.tr)*D2R; S.posT={x:h.tr.x-Math.sin(b)*8,y:h.tr.y-Math.cos(b)*8}; toast('走過去'); }
  else if(distOf(h.tr)>REACH) toast(`還差 ${Math.ceil(distOf(h.tr)-REACH)} m`);
});

/* ---------- 收集瞬間 ---------- */
function freezeFrame(){
  const c=fctx; c.setTransform(DPR,0,0,DPR,0,0);
  if(S.cam&&video.videoWidth){ const vw=video.videoWidth,vh=video.videoHeight,s=Math.max(W/vw,H/vh); c.drawImage(video,(W-vw*s)/2,(H-vh*s)/2,vw*s,vh*s); }
  else { drawFakeCam(); c.drawImage(bg,0,0,W,H); }
  frz.style.display='block';
}
function cropRect(){ const s={x:W/2,y:H/2}; /* 卡面取畫面中央 */ const w=Math.round(W*.64), h=Math.round(w*4/3);
  return {x:Math.max(8,Math.min(W-w-8,s.x-w/2)), y:Math.max(60,Math.min(H-h-130,s.y-h*.45)), w, h}; }
// 卡面直接用 canvas（不在動畫中途做 JPEG 編碼，避免卡頓）；要存或上傳時才轉成 dataURL
function cropCanvas(r,longSide){ const k=longSide/r.h, c=document.createElement('canvas'); c.width=Math.round(r.w*k); c.height=Math.round(r.h*k);
  c.getContext('2d').drawImage(frz,r.x*DPR,r.y*DPR,r.w*DPR,r.h*DPR,0,0,c.width,c.height); return c; }
function cardHTML(el,t,photo,sample){
  const k=rarOf(t), sp=spOf(t); el.style.setProperty('--rc',RC[k]); if(sp) el.style.setProperty('--sc',sp.c);
  const ph=el.querySelector('.ph'); ph.querySelectorAll('canvas').forEach(x=>x.remove());
  if(photo instanceof HTMLCanvasElement){ ph.style.backgroundImage='none'; photo.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover'; ph.prepend(photo); }
  else ph.style.backgroundImage=photo?`url(${photo})`:'none';
  el.querySelector('.rk').textContent=RAR[k].n;
  el.querySelector('.spn').innerHTML=sp?logo(sp):''; el.querySelector('.spn').style.display=sp?'grid':'none';
  el.querySelector('h3').textContent=t.species; el.querySelector('.pt').textContent='+'+(ptsOf(t)+(sp?SP_BONUS:0));
  el.querySelector('.id').textContent=`${t.id}・胸徑 ${t.dbh} cm`;
  el.querySelector('.bd').innerHTML='<span class="pill">模擬</span>'+(sp?`<span class="pill" style="background:#fff;border:2px solid ${sp.c};color:${sp.c}">${sp.name} 贊助</span><span class="pill">虛構</span>`:'');
}
const card=$('#card'), scan=$('#scan'), gain=$('#gain'), rays=$('#rays');
function capture(t,fast){
  if(S.busy||!t) return; S.busy=true; const T=fast?.6:1;
  const r=cropRect(); freezeFrame();
  sfx.shutter(); buzz([20,30,40]);
  $('#flash').animate([{opacity:.9},{opacity:0}],{duration:320,easing:'ease-out'});
  // 1 掃描線＋辨識中
  const box=scan.querySelector('.box'), tx=scan.querySelector('.txt');
  Object.assign(box.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'}); tx.textContent='辨識中';
  scan.style.display='block'; scan.classList.remove('run'); void scan.offsetWidth; scan.classList.add('run');
  [0,1,2,3].forEach(i=>setTimeout(()=>sfx.scan(i),i*150*T));
  setTimeout(()=>{ tx.textContent=`${t.species}・${t.id}`; },380*T);
  // 2 畫面變成卡面
  const photo=cropCanvas(r,640);
  setTimeout(()=>{
    scan.style.display='none'; sfx.flash();
    cardHTML(card,t,photo); card.classList.remove('lift','fly','ready');
    Object.assign(card.style,{display:'block',width:r.w+'px',height:r.h+'px',opacity:1,transform:`translate(${r.x}px,${r.y}px)`});
    rays.style.setProperty('--rc',RC[rarOf(t)]);

    const cw=Math.round(Math.min(W*.72,300)), ch=Math.round(cw*1.5), cx=(W-cw)/2, cy=Math.max(64,(H-ch)/2-40);
    card.classList.add('lift'); Object.assign(card.style,{width:cw+'px',height:ch+'px',transform:`translate(${cx}px,${cy}px)`});
    S.cardBox={x:cx,y:cy,w:cw,h:ch};
    setTimeout(()=>{ card.classList.add('ready'); rays.classList.add('show'); $('#dim').classList.add('show'); burstStars(cx+cw/2,cy+ch*.4,RC[rarOf(t)],t.days<0); sfx.reveal(t.days<0); buzz(t.days<0?[30,40,30,40,90]:[30,50,60]);
      const sp=spOf(t);
      gain.innerHTML=`<div class="big">${t.days<0?'從沒人拍過':t.days+' 天沒人拍'}　+${ptsOf(t)}</div>`+(sp?`<span class="sp" style="--sc:${sp.c}"><i>${logo(sp)}</i>${sp.name} 贊助 +${SP_BONUS}<span class="pill">虛構</span></span>`:'');
      gain.style.top=(cy+ch+14)+'px'; gain.classList.add('show');
      record(t,photo,fast);
      const tw=$('#twin'); tw.href='../#/tree/'+encodeURIComponent(t.id); tw.classList.add('show');
      S._lastT=fast?null:t; $('#done').classList.add('show'); // 停在爽點畫面，讓人看卡、點投票；按「再收一棵」才飛進圖鑑
    },560*T);
  },720*T);
}
function flyToDex(t){
  const b=(S.started?$('#back'):$('#dexbtn')).getBoundingClientRect(), a=app.getBoundingClientRect(), cb=S.cardBox; const s=b.width/cb.w; // 拍照模式圖鑑鈕藏起來，改飛向返回鍵

/* ---------- 記錄：真 GPS 送主站，模擬位置只存本機 ---------- */
const NICK_A=['路過的','愛散步的','騎車的','帶小孩的','早起的'], NICK_B=['樟樹粉','欒樹迷','榕樹控','茄苳友','樹蔭獵人'];
function nick(){ let n=store.get('nick',null); if(!n){ n=NICK_A[Math.random()*5|0]+NICK_B[Math.random()*5|0]+'#'+(Math.random()*900+100|0); store.set('nick',n);} return n; }
function record(t,photo,demo){
  const sp=spOf(t), pts=ptsOf(t)+(sp?SP_BONUS:0), d=Math.round(distOf(t));
  const entry={photo:null,canvas:photo,pts,at:Date.now()}; S.collected.set(t.id,entry); if(t.place) S.place=t.place; // 圖鑑開在最近收集的地點
  setTimeout(()=>{ try{ entry.photo=photo.toDataURL('image/jpeg',.8); }catch(e){} },2600);
  if(demo) return; // #upload 直達的展示不記點數
  store.set('points',(Number(store.get('points',0))||0)+pts);
  const mine=store.get('collect',[]); if(!Array.isArray(mine)) mine.length=0;
  mine.push({id:t.id,species:t.species,place:t.place,rarity:RAR[rarOf(t)].n,pts,at:Date.now(),sim:S.simPos}); store.set('collect',mine.slice(-300)); updateDexCount();
  if(S.simPos) return; // 模擬位置不送伺服器，避免室內 demo 的照片掛到真樹上
  if(t.demo||!/^[A-Z]{2}\d{10}$/.test(t.id)) return; // 示範區或非市府樹號：不送
  setTimeout(()=>{ const full=fullPhoto();
  fetch('/api/events',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({treeId:t.id,role:'citizen',kind:'photo',result:'正常',note:'',nickname:nick(),photo:full,pts,verify:Object.assign({method:'gps',dist:d,ok:d<=REACH},(d<=REACH&&S.gps)?{lat:+S.gps.lat.toFixed(6),lng:+S.gps.lng.toFixed(6)}:{})})})
    .then(r=>{ if(!(r.ok&&(r.headers.get('content-type')||'').includes('json'))) throw 0; })
    .catch(()=>{ const q=store.get('collectQueue',[]); q.push({treeId:t.id,pts,dist:d,at:Date.now()}); store.set('collectQueue',q.slice(-20)); });
  },2800);
}
function fullPhoto(){ // 長邊約 1280、字串 ≤ 420000
  const lw=Math.max(W,H)*DPR, k=Math.min(1,1280/lw), c=document.createElement('canvas'); c.width=Math.round(W*DPR*k); c.height=Math.round(H*DPR*k);
  c.getContext('2d').drawImage(frz,0,0,c.width,c.height); let q=.8, s=c.toDataURL('image/jpeg',q); while(s.length>420000&&q>.3){q-=.1; s=c.toDataURL('image/jpeg',q);} return s; }

  let list=all.slice().sort((a,b)=>(S.collected.has(b.id)-S.collected.has(a.id))||(['first','long','rare','common'].indexOf(rarOf(a))-['first','long','rare','common'].indexOf(rarOf(b))));
  if(dexF.rar==='got') list=list.filter(t=>S.collected.has(t.id)); else if(dexF.rar!=='all') list=list.filter(t=>rarOf(t)===dexF.rar);

    if(c) return `<button class="dc" data-id="${t.id}" style="--rc:${RC[k]}"><span class="f" style="${c.photo?`background-image:url(${c.photo})`:`background:linear-gradient(160deg,${RC[k]},#ffffff 85%)`}"></span>${c.photo?'':`<span class="samp">${t.species}</span>`}<span class="r"></span>${c.sample?'<span class="s"><span class="pill">模擬</span></span>':''}<span class="n">${t.species}<small>${t.id}</small></span></button>`;
    return `<button class="dc un" data-id="${t.id}" style="--rc:${RC[k]}">${SIL}<span class="q">？</span><span class="r"></span><span class="n">？？？<small>${RAR[k].n}</small></span></button>`; }).join('')

/* ---------- 星星粒子 ---------- */
let stars=[];
function burstStars(x,y,col,big){ const cols=[col,'#ffffff','#ffcd2e','#9bdc6e','#6cc8ff']; const n=reduce?10:(big?70:40);
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2, v=4+Math.random()*(big?10:7); stars.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,life:1,c:cols[i%cols.length],s:4+Math.random()*7,rot:Math.random()*6});} }
function drawStars(dt){ const c=xctx; c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,W,H); if(!stars.length) return; const k=Math.min(10,dt*60);
  for(const p of stars){p.x+=p.vx*k; p.y+=p.vy*k; p.vy+=.22*k; p.vx*=Math.pow(.985,k); p.life-=.009*k; p.rot+=.08*k; if(p.life<=0) continue;
    c.globalAlpha=Math.min(1,p.life*1.5); c.fillStyle=p.c; star(c,p.x,p.y,p.s,p.rot); c.fill(); c.strokeStyle='#ffffffaa'; c.lineWidth=1; c.stroke();}
  c.globalAlpha=1; stars=stars.filter(p=>p.life>0); }

/* ---------- 迴圈 ---------- */
let prev=performance.now();
function loop(now){
  const dt=Math.min(.1,(now-prev)/1000); prev=now;
  if(!S.sensor) S.qT=qEuler(-S.dragYaw,90+S.dragPitch,0);   // 沒有陀螺儀：假裝手機直拿，手指拖曳看四周
  if(S.qT) S.q=S.q?qlerp(S.q,S.qT,Math.min(1,dt*10)):S.qT;
  if(!S.q) S.q=qEuler(0,90,0);            // 低通濾波防抖
  R=qmat(S.q);
  if(S.needAnchor&&(S.sensor||!S.started||!window.DeviceOrientationEvent||now-(S.t0||(S.t0=now))>800)){ S.needAnchor=false; if(!absMode()) anchor(); }
  if(absMode()){ const want=adiff(camHeading(),S.compass); S.yawOff=norm(S.yawOff+adiff(want,S.yawOff)*Math.min(1,dt*2)); }
  if(S.posT){ S.pos.x+=(S.posT.x-S.pos.x)*Math.min(1,dt*2.5); S.pos.y+=(S.posT.y-S.pos.y)*Math.min(1,dt*2.5); if(Math.hypot(S.posT.x-S.pos.x,S.posT.y-S.pos.y)<.05){S.posT=null; panoDirty=true;} }
  if(!S.cam) drawFakeCam();
  drawOverlay(now); drawStars(Math.min(.25,(now-(S._pt||now))/1000)); S._pt=now;
  if(S.charging){ S.charge=Math.min(1,(now-chargeT0)/800); shut.style.setProperty('--p',S.charge); if(S.charge>=1&&!shut.classList.contains('full')){ shut.classList.add('full'); sfx.full(); buzz(15);} }
  if((S._ic=(S._ic||0)+1)%10===0) setInfo();
  requestAnimationFrame(loop);
}

/* ---------- 路由 ---------- */
function route(){
  const h=location.hash.slice(1);
  $('#dex').classList.toggle('open',h==='dex'); if(h==='dex') renderDex();
  if(h==='play'&&!S.started){ S.started=true; app.classList.add('started'); S.needAnchor=true; S.hintPending=true; setBadges(); setInfo(); }
  if(h==='upload'){ // 集氣完成那一刻＋卡片翻出（截圖與現場 demo 用）
    app.classList.add('started'); shut.style.setProperty('--p',1); shut.classList.add('full');
    setTimeout(()=>{ capture(S.target,true); shut.style.setProperty('--p',0); shut.classList.remove('full'); },420);
  }
}
addEventListener('hashchange',route);

/* ---------- 開場：推薦哪一顆 ---------- */
(function recommend(){
  const canCam=!!(window.isSecureContext&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
  const pick=twin=>{ $('#go').classList.toggle('rec',!twin); $('#gotwin').classList.toggle('rec',twin); };
  pick(!canCam);
  // 已經允許過定位：人不在台北就推薦孿生街景
  try{ navigator.permissions&&navigator.permissions.query({name:'geolocation'}).then(st=>{ if(st.state!=='granted') return;
    navigator.geolocation.getCurrentPosition(p=>{ const {latitude:a,longitude:b}=p.coords; if(a<24.96||a>25.22||b<121.44||b>121.67) pick(true); },()=>{},{maximumAge:600000,timeout:8000}); }).catch(()=>{}); }catch(e){}
})();

/* ---------- 載入資料 ---------- */
// 有 nearby.js（同事做的共用模組）就用它；沒有就讀本資料夾的 trees.json（同介面的暫時替身）
const HAS_NEARBY=()=>!!(window.Nearby&&typeof window.Nearby.load==='function');
function setOrigin(lat,lng){ LAT0=lat; LNG0=lng; MX=111320*Math.cos(LAT0*D2R); }
function adopt(list){ // list：{id,lat,lng,species,dbh,height,place,days,...}
  S.trees=list.map(t=>Object.assign({},t,{days:typeof t.days==='number'?t.days:staleDays(t.id)},toXY(t.lat,t.lng))); panoDirty=true; }
function firstSetup(homeLL,nearId){
  const h=toXY(homeLL.lat,homeLL.lng); S.pos={x:h.x,y:h.y};
  let near=nearId?S.trees.find(t=>t.id===nearId):null;
  if(!near){ let bd=1e9; for(const t of S.trees){ if(t.days>=0) continue; const d=Math.hypot(t.x-h.x,t.y-h.y); if(d<bd){bd=d;near=t;} } }
  // 模擬位置：退到目標樹 9 m 外，讓它落在 15 m 內
  if(near){ const d=Math.hypot(near.x-h.x,near.y-h.y); if(d<6||d>14){ const a=d<1?Math.PI:Math.atan2(h.x-near.x,h.y-near.y); S.pos={x:near.x+Math.sin(a)*9,y:near.y+Math.cos(a)*9}; } }
  S.place=(near&&near.place)||(S.trees[0]&&S.trees[0].place)||'';
  const saved=store.get('collect',[]); if(Array.isArray(saved)) for(const c of saved) if(c&&c.id) S.collected.set(c.id,{photo:null,pts:c.pts,at:c.at});
  if(Array.isArray(saved)){ const last=[...saved].reverse().find(c=>c&&c.place&&S.trees.some(t=>t.place===c.place)); if(last) S.place=last.place; }
  const samp=S.trees.filter(t=>t.place===S.place&&t.days>=0).sort((a,b)=>b.days-a.days);
  [samp[0],samp[Math.floor(samp.length/3)],samp[samp.length-1]].forEach(t=>{ if(t&&!S.collected.has(t.id)) S.collected.set(t.id,{photo:null,pts:ptsOf(t),sample:true}); });
  const want=new URLSearchParams(location.search).get('tree'), wt=want&&S.trees.find(t=>t.id===want);
  if(wt){ near=wt; const d=Math.hypot(wt.x-S.pos.x,wt.y-S.pos.y); if(d>14){ const a=Math.atan2(S.pos.x-wt.x,S.pos.y-wt.y)||Math.PI; S.pos={x:wt.x+Math.sin(a)*9,y:wt.y+Math.cos(a)*9}; } S.place=wt.place; }
  S.target=near&&(!S.collected.has(near.id)||wt)?near:null; if(!S.target) pickTarget();
  resize(); anchor(); setBadges(); setInfo(); updateDexCount(); route();
}
function loadLocal(){
  return fetch('trees.json').then(r=>r.json()).then(J=>{
    const ci=n=>J.cols.indexOf(n), pick=(arr,v)=>typeof v==='number'?arr[v]:v;
    const I={id:ci('id'),lng:ci('lng'),lat:ci('lat'),sp:ci('species'),dbh:ci('dbh'),h:ci('height'),pl:ci('place'),days:ci('days')};
    let mnLa=90,mxLa=-90,mnLn=180,mxLn=-180;
    for(const r of J.rows){ mnLa=Math.min(mnLa,r[I.lat]); mxLa=Math.max(mxLa,r[I.lat]); mnLn=Math.min(mnLn,r[I.lng]); mxLn=Math.max(mxLn,r[I.lng]); }
    BBOX=[mnLn,mnLa,mxLn,mxLa]; setOrigin(J.home.lat,J.home.lng);
    adopt(J.rows.map(r=>({id:r[I.id],lat:r[I.lat],lng:r[I.lng],species:pick(J.species,r[I.sp]),dbh:r[I.dbh],height:r[I.h],place:pick(J.places,r[I.pl]),days:r[I.days]})));
    S.baseTrees=S.trees; S.home=J.home; firstSetup(J.home,J.home.nearTree);
  });
}
async function noteDemo(r){ // 示範區：note 寫虛構就標「示範區・模擬樹」
  S.demo=!!(r&&r.demo); if(!S.demo){ setBadges(); return; }
  let note=r.note||(r.trees&&r.trees[0]&&r.trees[0].note)||'';
  const dq=new URLSearchParams(location.search).get('demo');
  if(!note&&dq){ try{ note=(await (await fetch('./trees-'+dq+'.json')).json()).note||''; }catch(e){} }
  S.demoLabel=/虛構|模擬|示範用/.test(note)?'示範區・模擬樹':'示範區'; setBadges(); }
function loadNearby(){
  return Promise.resolve(window.Nearby.load({})).then(r=>{
    const home=r.home||{lat:r.trees[0].lat,lng:r.trees[0].lng}; setOrigin(home.lat,home.lng);
    adopt(r.trees); S.baseTrees=S.trees; S.home=home; S.nearbyMode=true; firstSetup(home,home.nearTree); noteDemo(r);
  });
}
(HAS_NEARBY()?loadNearby().catch(()=>loadLocal()):loadLocal()).catch(()=>toast('樹木資料載入失敗',5000));
resize(); requestAnimationFrame(loop);
})();
</script>
