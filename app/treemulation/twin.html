<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#6cc8ff">
<title>模樹 Treemulation・孿生街景</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{
  --sky:#6cc8ff; --sky2:#c9ecff; --grass:#9bdc6e; --grass2:#7cc653; --leaf:#2e9e5b; --navy:#17405e; --sun:#ffcd2e; --sun2:#e8a300;
  --card:#ffffff; --mute:#5d7f97; --shadow:#17405e22;
  --r-first:#ffcd2e; --r-long:#ff6fb5; --r-rare:#3fb6ff; --r-common:#8fe06a;
  --round:"Huninn","M PLUS Rounded 1c","Noto Sans TC",system-ui,sans-serif; --num:"Fredoka","Huninn",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#dff3ff;color:var(--navy);font-family:var(--round);overscroll-behavior:none}
body{display:grid;place-items:center;overflow:hidden}
#app{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background:linear-gradient(180deg,var(--sky) 0%,#a6defc 34%,var(--sky2) 52%,#e9f7ff 60%,#d6edb9 61%)}
@media (min-width:600px){#app{width:390px;height:min(844px,96vh);border-radius:40px;box-shadow:0 30px 80px #17405e40,0 0 0 8px #fff}}
#map{position:absolute;inset:0}
.maplibregl-canvas{outline:none}
button{font-family:inherit}
.badge{display:inline-flex;align-items:center;gap:4px;font:700 11px/1 var(--round);padding:5px 9px;border-radius:99px;background:#fff;color:var(--mute);white-space:nowrap;box-shadow:0 3px 0 var(--shadow)}
.badge.twin{background:var(--leaf);color:#fff}
.badge.twin svg{width:13px;height:13px}
.pill{display:inline-flex;align-items:center;font:700 10.5px/1 var(--round);padding:3px 7px;border-radius:99px;background:#eaf3f8;color:var(--mute);white-space:nowrap}
.ib{appearance:none;cursor:pointer;height:40px;min-width:40px;padding:0 14px;border-radius:99px;border:0;background:#fff;color:var(--navy);font:800 13px/1 var(--round);display:inline-flex;align-items:center;justify-content:center;gap:4px;text-decoration:none;box-shadow:0 4px 0 var(--shadow)}
.ib svg{width:18px;height:18px}
.ib:focus-visible,.btn:focus-visible,#walk:focus-visible,#shut:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
#sound{padding:0}
#sound.off .on{display:none}#sound:not(.off) .x{display:none}

/* 頂部 */
#top{position:absolute;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top)) 12px 0;z-index:10;pointer-events:none;display:flex;flex-direction:column;gap:10px}
#row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#row1 .l{display:flex;flex-direction:column;gap:7px;align-items:flex-start;pointer-events:auto}
#row1 .bs{display:flex;gap:5px;flex-wrap:wrap}
#row1 .r{display:flex;gap:8px;pointer-events:auto;align-items:center}
#pts{height:40px;display:inline-flex;align-items:center;gap:5px;padding:0 6px 0 5px;border-radius:99px;background:var(--sun);box-shadow:0 4px 0 var(--sun2);color:var(--navy)}
#pts .ic{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--sun2);font-size:16px}
#pts b{font:700 17px/1 var(--num)}
#pts .pill{background:#fff8}
#goal{pointer-events:none;align-self:center;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:100%}
#goal .g1{display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:8px 14px 8px 8px;font:800 15px/1.1 var(--round);box-shadow:0 5px 0 var(--shadow);white-space:nowrap;max-width:100%}
#goal .g1 .dot{width:26px;height:26px;border-radius:50%;background:var(--r-first);display:grid;place-items:center;flex:none}
#goal .g1 .dot svg{width:16px;height:16px}
#goal .g1 b{font:700 16px/1 var(--num)}
#goal .g1 span.m{color:var(--mute);font-weight:700}
#goal .g2{font:900 15px/1 var(--round);padding:8px 14px;border-radius:99px;background:var(--navy);color:#fff;box-shadow:0 4px 0 #0e2c42;transition:background .25s,color .25s,transform .25s cubic-bezier(.2,1.6,.3,1)}
#goal .g2 b{font:700 16px/1 var(--num)}
#goal.near .g2{background:var(--sun);color:var(--navy);box-shadow:0 4px 0 var(--sun2);transform:scale(1.08)}

/* 樹上的標記 */
#mk{position:absolute;left:0;top:0;z-index:6;pointer-events:none;will-change:transform;display:none}
#mk .s{position:absolute;left:-17px;top:-44px;width:34px;height:40px;animation:bob 1.4s ease-in-out infinite}
#mk .s svg{width:34px;height:40px;filter:drop-shadow(0 3px 0 #17405e40)}
#mk.near .s{animation:bob .6s ease-in-out infinite}
#mk.edge .s{animation:none}
@keyframes bob{50%{transform:translateY(-7px)}}
#intro{position:absolute;left:0;top:0;z-index:7;pointer-events:none;display:none;will-change:transform}
#intro .b{position:absolute;left:0;top:-58px;transform:translateX(-50%);background:#fff;color:var(--navy);font:900 17px/1 var(--round);padding:11px 16px;border-radius:99px;white-space:nowrap;box-shadow:0 5px 0 var(--shadow);animation:pop .5s cubic-bezier(.2,1.6,.3,1)}
#intro .b::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:#fff}
#intro .rg{position:absolute;left:-46px;top:-46px;width:92px;height:92px;border-radius:50%;border:4px solid var(--sun);animation:ping 1s ease-out infinite}
@keyframes pop{from{transform:translateX(-50%) scale(.4);opacity:0}}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}

/* 底部 */
#bot{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(22px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto 1fr;align-items:end;z-index:10;pointer-events:none}
#walk{pointer-events:auto;justify-self:start;appearance:none;cursor:pointer;border:0;background:#fff;color:var(--navy);border-radius:28px;height:66px;padding:0 16px 0 12px;display:flex;align-items:center;gap:7px;font:900 15px/1 var(--round);box-shadow:0 6px 0 #c6dce9;touch-action:none;white-space:nowrap}
#walk svg{width:26px;height:26px;color:var(--leaf)}
#walk.on{background:var(--grass);box-shadow:0 2px 0 var(--grass2);transform:translateY(4px)}
#walk.on svg{color:var(--navy);animation:step .5s steps(2) infinite}
@keyframes step{50%{transform:translateY(-2px) rotate(-6deg)}}
#shut{pointer-events:auto;appearance:none;cursor:pointer;width:88px;height:88px;border-radius:50%;border:0;padding:0;position:relative;background:none;touch-action:none}
#shut .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--sun) calc(var(--p,0)*360deg),#ffffffaa 0)}
#shut .core{position:absolute;inset:9px;border-radius:50%;background:#fff;box-shadow:0 5px 0 #c6dce9;transition:transform .12s,background .2s}
#shut .tm{position:absolute;inset:0;border-radius:50%;border:5px solid var(--sun);opacity:0;pointer-events:none}
#shut.charging .tm{animation:shrink .8s linear forwards}
@keyframes shrink{0%{transform:scale(2.1);opacity:.25;border-color:#fff}70%{opacity:1;border-color:var(--sun)}100%{transform:scale(.98);opacity:1}}
#shut.charging .core{transform:scale(.9)}
#shut.full .ring{filter:drop-shadow(0 0 10px var(--sun))}
#shut.full .core{background:var(--sun);box-shadow:0 5px 0 var(--sun2)}
#shut.off{cursor:default}
#shut.off .ring{background:#ffffff66}
#shut.off .core{background:#ffffffb0;box-shadow:none}
#shut.ready .core{background:var(--sun);box-shadow:0 5px 0 var(--sun2)}
#shut.ready::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid #fff;animation:ping 1.2s ease-out infinite;pointer-events:none}
#dexlink{pointer-events:auto;justify-self:end;text-decoration:none;background:#fff;color:var(--navy);border-radius:22px;width:66px;height:66px;display:grid;place-items:center;align-content:center;gap:3px;box-shadow:0 5px 0 var(--shadow);font:800 11px/1 var(--round)}
#dexlink .ic{width:30px;height:30px;border-radius:10px;background:var(--leaf);display:grid;place-items:center}
#dexlink .ic svg{width:18px;height:18px}
#app.busy #bot,#app.busy #mk,#app.busy #intro{visibility:hidden}
#credit{position:absolute;right:8px;bottom:calc(4px + env(safe-area-inset-bottom));font:600 9px/1 var(--round);color:#17405ebb;z-index:9;pointer-events:none;background:#ffffffa0;padding:3px 6px;border-radius:99px}

#toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.9);opacity:0;transition:.25s cubic-bezier(.2,1.5,.3,1);z-index:40;pointer-events:none;
  font:800 15px/1.3 var(--round);color:var(--navy);background:#fff;padding:11px 18px;border-radius:99px;white-space:nowrap;box-shadow:0 5px 0 var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#load{position:absolute;inset:0;z-index:60;display:grid;place-items:center;background:linear-gradient(180deg,var(--sky),var(--sky2));font:900 18px var(--round);color:var(--navy);transition:opacity .4s}
#load.gone{opacity:0;pointer-events:none}

/* 收集瞬間（樣式照 collect.html） */
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
#rays{position:absolute;left:50%;top:40%;width:900px;height:900px;margin:-450px 0 0 -450px;z-index:22;pointer-events:none;opacity:0;transition:opacity .4s;
  background:repeating-conic-gradient(from 0deg,var(--rc) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);animation:spin 14s linear infinite}
#rays.show{opacity:.55}
@keyframes spin{to{transform:rotate(360deg)}}
#dim{position:absolute;inset:0;z-index:21;background:#17405e;opacity:0;pointer-events:none;transition:opacity .4s}
#dim.show{opacity:.4;pointer-events:auto}
#card{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top));z-index:25;display:none;perspective:1000px;width:min(72vw,282px);aspect-ratio:2/3;margin-left:calc(min(72vw,282px)/-2)}
#card .flip{width:100%;height:100%;position:relative;transform-style:preserve-3d;transform:rotateY(180deg) scale(.6);opacity:0}
#card.show .flip{animation:flipin .8s cubic-bezier(.2,1.25,.35,1) forwards}
@keyframes flipin{0%{transform:rotateY(180deg) scale(.6);opacity:0}15%{opacity:1}100%{transform:rotateY(0) scale(1);opacity:1}}
#card .in,#card .back{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
#card .in{padding:8px;background:#fff;box-shadow:0 8px 0 #c6dce9,0 24px 50px #17405e55;display:flex;flex-direction:column}
#card.show.settled .in{animation:tilt 3.2s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotateY(-6deg) rotateX(3deg)}50%{transform:rotateY(6deg) rotateX(-2deg)}}
#card .back{transform:rotateY(180deg);background:radial-gradient(circle at 50% 40%,#fff6c9,var(--sun) 45%,var(--sun2));box-shadow:0 8px 0 #b98200;display:grid;place-items:center}
#card .back svg{width:46%;opacity:.9}
.ph{flex:1;border-radius:20px;background:#9ab center/cover no-repeat;position:relative;overflow:hidden;border:4px solid var(--rc)}
.ph canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
  background:linear-gradient(115deg,transparent 30%,#ffffffcc 44%,#ffd6f0aa 50%,#c9f0ffaa 56%,transparent 70%);background-size:260% 100%;animation:holo 2.4s linear infinite}
@keyframes holo{from{background-position:120% 0}to{background-position:-60% 0}}
.rk{position:absolute;left:8px;top:8px;font:800 13px/1 var(--round);color:var(--navy);background:var(--rc);padding:6px 11px;border-radius:99px;box-shadow:0 3px 0 #17405e30;z-index:1}
.spn{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;border:2.5px solid var(--sc);z-index:1}
.spn svg{width:20px;height:20px}
.tw{position:absolute;left:8px;bottom:8px;z-index:1;display:inline-flex;align-items:center;gap:4px;font:800 12px/1 var(--round);color:#fff;background:var(--leaf);padding:6px 10px 6px 8px;border-radius:99px;box-shadow:0 3px 0 #17405e40}
.tw svg{width:14px;height:14px}
.meta{padding:10px 8px 4px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:end;color:var(--navy)}
.meta h3{margin:0;font:800 24px/1.1 var(--round)}
.meta .pt{grid-row:1/3;grid-column:2;font:700 26px/1 var(--num);color:var(--navy);background:var(--sun);border-radius:99px;padding:8px 14px;box-shadow:0 4px 0 var(--sun2)}
.meta .id{font:600 11px/1.4 var(--num);color:var(--mute)}
.meta .bd{grid-column:1/3;display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
#gain{position:absolute;left:0;right:0;z-index:26;text-align:center;pointer-events:none;opacity:0;display:flex;flex-direction:column;align-items:center;gap:7px}
#gain .big{font:800 16px/1 var(--round);color:var(--navy);background:#fff;border-radius:99px;padding:9px 16px;box-shadow:0 4px 0 var(--shadow)}
#gain .big b{font:700 18px/1 var(--num)}
#gain .sp{display:inline-flex;align-items:center;gap:6px;font:800 12.5px/1 var(--round);background:#fff;color:var(--sc);border:2.5px solid var(--sc);padding:4px 8px 4px 4px;border-radius:99px}
#gain .sp i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
#gain .sp svg{width:16px;height:16px}
#gain.show{opacity:1;transition:opacity .3s .1s}
#done{position:absolute;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:26;display:none;flex-direction:column;gap:10px}
#done.show{display:flex}
#done .row{display:flex;gap:10px}
.btn{flex:1;appearance:none;cursor:pointer;border:0;font:900 17px var(--round);color:var(--navy);background:var(--sun);border-radius:99px;height:54px;padding:0 16px;box-shadow:0 6px 0 var(--sun2);white-space:nowrap;display:grid;place-items:center;text-decoration:none}
.btn.w{background:#fff;box-shadow:0 6px 0 #c6dce9}
.btn.s{flex:none;height:44px;font-size:14px;background:#ffffffe8;box-shadow:0 4px 0 #c6dce9}
.btn:active{transform:translateY(4px)}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:27;pointer-events:none}
@media (prefers-reduced-motion:reduce){.ph::after,#rays,#shut.charging .tm,#mk .s,#intro .rg,#card.show.settled .in{animation:none}#card.show .flip{animation-duration:.01s}}
</style>
<script>try{if(localStorage.getItem("tt.points")==null){localStorage.setItem("tt.points","60");localStorage.setItem("tt.gift","1");}}catch(e){} /* 新使用者見面禮 60 點（模擬） */</script>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="mk"><div class="s"><svg viewBox="0 0 34 40"><path d="M17 39c-1-6-13-13-13-23a13 13 0 0 1 26 0c0 10-12 17-13 23z" fill="#ffcd2e" stroke="#fff" stroke-width="3"/><path d="M17 8l2.6 5.4 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="#fff"/></svg></div></div>
  <div id="intro"><div class="rg"></div><div class="b">這就是目標樹</div></div>

  <div id="top">
    <div id="row1">
      <div class="l">
        <a class="ib" href="./" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>模樹</a>
        <div class="bs">
          <span class="badge twin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M6 20V9l4-3v14M14 20V4l5 3v13"/></svg>孿生街景</span>
          <span class="badge" id="bpos">模擬位置</span>
        </div>
      </div>
      <div class="r">
        <span id="pts"><span class="ic">★</span><b id="ptn">0</b><span class="pill">模擬</span></span>

      </div>
    </div>
    <div id="goal" aria-live="polite">
      <div class="g1"><span class="dot"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.3l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="#fff"/></svg></span><span id="gt">目標：…</span></div>
      <div class="g2" id="gs">載入中</div>
    </div>
  </div>

  <div id="bot">
    <button id="walk" aria-label="按住往前走"><svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="8" cy="7" rx="2.6" ry="3.6"/><ellipse cx="16" cy="11" rx="2.6" ry="3.6"/><circle cx="8" cy="13" r="1.4"/><circle cx="16" cy="17" r="1.4"/></svg>往前走</button>

    <a id="dexlink" href="./collect.html#dex"><span class="ic"><svg viewBox="0 0 20 20"><path d="M3 4c3-1 5 0 7 1.5C12 4 14 3 17 4v12c-3-1-5 0-7 1.5C8 16 6 15 3 16z" fill="#fff"/><path d="M10 5.5v12" stroke="#2e9e5b" stroke-width="1.4"/></svg></span>圖鑑</a>
  </div>
  <div id="credit">© OpenStreetMap contributors</div>

  <div id="flash"></div>
  <div id="dim"></div>
  <div id="rays"></div>
  <div id="card"><div class="flip">
    <div class="in"><div class="ph"><span class="rk"></span><span class="spn"></span><span class="tw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M6 20V9l4-3v14M14 20V4l5 3v13"/></svg>孿生街景</span></div><div class="meta"><h3></h3><div class="pt"></div><div class="id"></div><div class="bd"></div></div></div>
    <div class="back"><svg viewBox="0 0 40 48"><path d="M20 4c8 0 14 6 14 13 0 6-4 10-9 11v14h-10V28c-5-1-9-5-9-11C6 10 12 4 20 4z" fill="#fff"/></svg></div>
  </div></div>
  <div id="gain"></div>
  <div id="done">
    <div class="row"><button class="btn w" id="again">再找一棵</button><a class="btn" href="./collect.html#dex" id="todex">看圖鑑</a></div>
    <a class="btn s" id="totwin" href="../">在樹位孿生看完整紀錄</a>
    <a class="btn s" href="https://puma.taipei/hackathon/vote" target="_blank" rel="noopener">🗳 喜歡就投一票</a>

<script>
'use strict';
const $=s=>document.querySelector(s);

  btn.addEventListener('click',e=>{e.stopPropagation();on=!on;btn.classList.toggle('off',!on);if(on)unlock();});

  const live=()=>ac&&on&&ok;
  function tone(f,t0,d,type='sine',v=.15,f2){if(!live())return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05);}
  function noise(t0,d,v=.4,f=2400){if(!live())return;const n=ac.sampleRate*d|0,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=ac.createBufferSource();s.buffer=b;const fl=ac.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;const g=ac.createGain();g.gain.value=v;s.connect(fl).connect(g).connect(ac.destination);s.start(ac.currentTime+t0);}

    chargeStart(){if(!live())return;const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='sawtooth';o2.type='sine';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(720,t+.8);o2.frequency.setValueAtTime(360,t);o2.frequency.exponentialRampToValueAtTime(1440,t+.8);

function qmul(a,b){return[a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];}
function qEuler(al,be,ga){const h=x=>x*D2R/2; const z=[Math.cos(h(al)),0,0,Math.sin(h(al))], x=[Math.cos(h(be)),Math.sin(h(be)),0,0], y=[Math.cos(h(ga)),0,Math.sin(h(ga)),0]; return qmul(qmul(z,x),y);}
function qlerp(a,b,t){let d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3]; const s=d<0?-1:1; const r=a.map((v,i)=>v+(s*b[i]-v)*t); const n=Math.hypot(...r); return r.map(v=>v/n);}
function qmat(q){const[w,x,y,z]=q;return[[1-2*(y*y+z*z),2*(x*y-w*z),2*(x*z+w*y)],[2*(x*y+w*z),1-2*(x*x+z*z),2*(y*z-w*x)],[2*(x*z-w*y),2*(y*z+w*x),1-2*(x*x+y*y)]];}

function circle(x,y,r,n){const c=[];for(let i=0;i<=n;i++){const a=(i%n)/n*Math.PI*2;c.push(toLL(x+Math.cos(a)*r,y+Math.sin(a)*r));}return [c];}

// 第一人稱相機：人站在 u、眼高 EYE；換算成 MapLibre 的 center／zoom
let lastCam='';
function applyCam(){
  const P=clamp(S.pitch,70,85), B=norm(S.bear), d=EYE/Math.cos(P*D2R), f=focal();
  const mpp=d/f, z=Math.log2(mppK/mpp), ahead=d*Math.sin(P*D2R);
  const cx=S.u.x+Math.sin(B*D2R)*ahead, cy=S.u.y+Math.cos(B*D2R)*ahead;
  const pad=padT();
  const key=cx.toFixed(2)+','+cy.toFixed(2)+','+B.toFixed(2)+','+P.toFixed(2)+','+z.toFixed(3)+','+pad;
  if(key===lastCam) return; lastCam=key;
  map.jumpTo({center:toLL(cx,cy),zoom:clamp(z,14,24),bearing:B,pitch:P,padding:{top:pad,bottom:0,left:0,right:0}});
}
// 視線中心往下移，讓地平線低一點、多看到樹冠
function padT(){ return Math.round(app.clientHeight*.32); }
// 自己的針孔投影（給標記用，跟 MapLibre 相機一致）
function proj(x,y,h){
  const B=S.bear*D2R, a=(90-clamp(S.pitch,70,85))*D2R, dx=x-S.u.x, dy=y-S.u.y, dz=h-EYE;
  const xr=dx*Math.cos(B)-dy*Math.sin(B), fh=dx*Math.sin(B)+dy*Math.cos(B);
  const depth=fh*Math.cos(a)-dz*Math.sin(a), up=fh*Math.sin(a)+dz*Math.cos(a);
  const W=app.clientWidth,H=app.clientHeight,f=focal();
  return {x:W/2+f*xr/depth, y:(H+padT())/2-f*up/depth, depth};
}

/* ---------- 資料 ---------- */
function treeFeatures(list){
  const fs=[], hs=[];
  for(const t of list){
    const p=toXY(t.lat,t.lng), h=treeH(t), r=crownR(t), never=t.days<0&&!S.collected.has(t.id);
    const leaf=never?'#7cc653':(t.days>=365?'#3e9a52':'#4aa95c'), leaf2=never?'#a6d65a':'#69bd61';
    const b0=Math.max(1.8,h*.38);
    fs.push({type:'Feature',properties:{c:'#8a6a4a',b:0,t:b0+.6},geometry:{type:'Polygon',coordinates:circle(p.x,p.y,clamp(r*.09,.14,.32),7)}});
    fs.push({type:'Feature',properties:{c:leaf,b:b0,t:b0+(h-b0)*.72},geometry:{type:'Polygon',coordinates:circle(p.x,p.y,r,12)}});
    fs.push({type:'Feature',properties:{c:leaf2,b:b0+(h-b0)*.72,t:h},geometry:{type:'Polygon',coordinates:circle(p.x,p.y,r*.66,12)}});
    if(never) hs.push({type:'Feature',properties:{b:b0-.3,t:h+.5},geometry:{type:'Polygon',coordinates:circle(p.x,p.y,r+.55,14)}});
  }
  return [{type:'FeatureCollection',features:fs},{type:'FeatureCollection',features:hs}];
}
function setTreeData(){ const [a,b]=treeFeatures(S.trees); map.getSource('trees').setData(a); map.getSource('halo').setData(b); }
function setTargetData(){
  const t=S.target; if(!t){ map.getSource('tgt').setData(EMPTY); return; }
  const p=toXY(t.lat,t.lng), h=treeH(t), r=crownR(t), b0=Math.max(1.8,h*.38);
  map.getSource('tgt').setData({type:'FeatureCollection',features:[{type:'Feature',properties:{b:b0-.6,t:h+1.2},geometry:{type:'Polygon',coordinates:circle(p.x,p.y,r+1.3,16)}}]});
}
function setGlow(on){ // 只在狀態改變時改 paint
  map.setPaintProperty('tgt','fill-extrusion-opacity',on?.55:.16);
  map.setPaintProperty('tgt','fill-extrusion-color',on?'#fff07a':'#ffd23f');
}

async function loadAll(){
  if(/[?&]demo=/.test(location.search)){ // 台北以外的示範區：沒有建物資料，只畫地面與樹
    const res=await Nearby.load(null);
    if(res&&res.demo){
      setOrigin(res.home.lat,res.home.lng); S.demo=true;
      $('#bpos').textContent='示範區・模擬樹';
      S.trees=res.trees.map(t=>Object.assign({},t)); S.trees.forEach(t=>S.byId[t.id]=t);
      setTreeData(); return pickStart();
    }
  }
  const [osm,raw]=await Promise.all([fetch('./twin-osm.json').then(r=>r.json()),fetch('./trees.json').then(r=>r.json())]);
  const home=raw.home; setOrigin(home.lat,home.lng);
  S.roads=osm.features.filter(f=>f.properties.k==='r').map(f=>f.geometry.coordinates.map(([ln,la])=>toXY(la,ln)));
  S.blds=osm.features.filter(f=>f.properties.k==='b').map(f=>{ const pts=f.geometry.coordinates[0].map(([ln,la])=>toXY(la,ln)); let a=1e9,b=1e9,c=-1e9,d=-1e9; pts.forEach(q=>{a=Math.min(a,q.x);b=Math.min(b,q.y);c=Math.max(c,q.x);d=Math.max(d,q.y);}); return {pts,bb:[a,b,c,d]}; });
  map.getSource('osm').setData(osm);
  const c={}; raw.cols.forEach((n,i)=>c[n]=i);
  const pick=(a,v)=>typeof v==='number'&&a?a[v]:v;
  const all=[];
  for(const r of raw.rows){
    const t={id:r[c.id],lat:r[c.lat],lng:r[c.lng],species:pick(raw.species,r[c.species]),dbh:r[c.dbh],height:r[c.height],place:pick(raw.places,r[c.place])};
    const p=toXY(t.lat,t.lng); if(Math.hypot(p.x,p.y)>OSM_R) continue;
    t.days=Nearby.staleDays(t.id); t.pts=Nearby.photoPoints(t.days); all.push(t);
  }
  S.trees=all; all.forEach(t=>S.byId[t.id]=t);
  setTreeData();
  pickStart();
}
function pickStart(){
  const want=new URLSearchParams(location.search).get('tree');
  let t=want&&S.byId[want];
  if(want&&!t){ toast('這棵不在孿生街景範圍，換最近一棵'); }
  if(!t) t=nextTarget(0,0);
  setTarget(t,true);
}
function nextTarget(x,y,skip){
  let best=null,bd=1e9;
  for(const t of S.trees){ if(t.days>=0||S.collected.has(t.id)||(skip&&t.id===skip)) continue;
    const p=toXY(t.lat,t.lng), d=Math.hypot(p.x-x,p.y-y); if(d<bd){bd=d;best=t;} }
  return best||S.trees[0];
}
// 站位：沿最近道路方向、離樹 dist 公尺的人行道上，面向樹
function standPoint(t,dist){
  const p=toXY(t.lat,t.lng); let best=null,bd=1e9;
  for(const L of S.roads) for(let i=0;i<L.length-1;i++){ const a=L[i],b=L[i+1], vx=b.x-a.x, vy=b.y-a.y, l2=vx*vx+vy*vy; if(!l2) continue;
    const k=clamp(((p.x-a.x)*vx+(p.y-a.y)*vy)/l2,0,1), qx=a.x+vx*k, qy=a.y+vy*k, d=Math.hypot(p.x-qx,p.y-qy);
    if(d<bd){bd=d;const l=Math.sqrt(l2);best={dx:vx/l,dy:vy/l,q:{x:qx,y:qy}};} }
  let dx=best?best.dx:0, dy=best?best.dy:-1;
  if(!best){ // 沒道路資料：用最近的鄰樹方向當路的方向
    let nb=null,nd=1e9; for(const o of S.trees){ if(o===t) continue; const q=toXY(o.lat,o.lng), d=Math.hypot(q.x-p.x,q.y-p.y); if(d>.5&&d<nd){nd=d;nb=q;} }
    if(nb){ const l=Math.hypot(nb.x-p.x,nb.y-p.y); dx=(nb.x-p.x)/l; dy=(nb.y-p.y)/l; } }
  // 兩個方向挑離家（原點）近的那邊
  if(Math.hypot(p.x+dx*dist,p.y+dy*dist)>Math.hypot(p.x-dx*dist,p.y-dy*dist)){dx=-dx;dy=-dy;}
  // 往遠離路中心那側（人行道）偏一點；撞到建物就換位置
  let nx=-dy, ny=dx; if(best&&best.q&&((p.x-best.q.x)*nx+(p.y-best.q.y)*ny)<0){nx=-nx;ny=-ny;}
  let u=null;
  for(const sgn of [1,-1]) for(const off of [2.5,1,0,-1.5,-3,4]){ if(u) break;
    const c={x:p.x+sgn*dx*dist+nx*off,y:p.y+sgn*dy*dist+ny*off}; if(clearAt(c.x,c.y)) u=c; }
  if(!u) u={x:p.x+dx*dist,y:p.y+dy*dist};
  return {u,bear:norm(Math.atan2(p.x-u.x,p.y-u.y)/D2R)};
}
function inPoly(x,y,pts){ let c=false; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const a=pts[i],b=pts[j]; if(((a.y>y)!==(b.y>y))&&(x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)) c=!c; } return c; }
function clearAt(x,y,m=.8){ if(!S.blds) return true;
  for(const B of S.blds){ const bb=B.bb; if(x<bb[0]-m||x>bb[2]+m||y<bb[1]-m||y>bb[3]+m) continue;
    if(inPoly(x,y,B.pts)||inPoly(x+m,y,B.pts)||inPoly(x-m,y,B.pts)||inPoly(x,y+m,B.pts)||inPoly(x,y-m,B.pts)) return false; }
  return true; }
function setTarget(t,place){
  S.target=t; S.near=null; setTargetData();
  if(place){ const s=standPoint(t,shotMode?10:25); S.u=s.u; S.bear=s.bear; S.pitch=shotMode?80:84; S.yaw0=null; }
  S.intro=performance.now();
  $('#totwin').href='../#/tree/'+encodeURIComponent(t.id);
  updGoal(true);
}

/* ---------- 目標列 ---------- */
let goalKey='';
function tDist(){ const t=S.target; if(!t) return 1e9; const p=toXY(t.lat,t.lng); return Math.hypot(p.x-S.u.x,p.y-S.u.y); }
function updGoal(force){
  const t=S.target; if(!t) return;
  const d=Math.round(tDist()), near=d<=REACH;
  const key=d+'|'+near+'|'+t.id; if(key===goalKey&&!force) return; goalKey=key;
  const status=t.days<0?'從沒人拍過':t.days+' 天沒人拍';
  $('#gt').innerHTML=`目標：${t.species}・<b>${d}</b> m・<span class="m">${status}</span>`;
  $('#gs').innerHTML=near?'可以拍了':`再走近 <b>${Math.max(1,d-REACH)}</b> m`;
  if(near!==S.near){
    const first=S.near===null; S.near=near;
    $('#goal').classList.toggle('near',near); $('#mk').classList.toggle('near',near);
    $('#shut').classList.toggle('off',!near); $('#shut').classList.toggle('ready',near);
    if(map.isStyleLoaded()) setGlow(near);
    if(near&&!first){ sfx.near(); buzz([20,40,20]); }
  }
}

/* ---------- 陀螺儀（相對方向）＋拖曳 ---------- */
function onOri(e){ if(e.alpha==null) return; S.qT=qEuler(e.alpha,e.beta||0,e.gamma||0); if(!S.q) S.q=S.qT; S.sensor=true; }
window.addEventListener('deviceorientation',onOri);
let permAsked=false;
function askPerm(){ if(permAsked) return; permAsked=true; sfx.unlock();
  try{ if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function')
    DeviceOrientationEvent.requestPermission().then(s=>{ if(s==='granted') window.addEventListener('deviceorientation',onOri); }).catch(()=>{}); }catch(e){} }
app.addEventListener('click',askPerm,true); app.addEventListener('touchend',askPerm,true);
function sensorView(){
  if(!S.sensor||!S.qT) return;
  S.q=qlerp(S.q,S.qT,.22);
  const R=qmat(S.q), fx=-R[0][2], fy=-R[1][2], fz=-R[2][2]; // 手機背面朝向
  const horiz=Math.hypot(fx,fy); if(horiz<.05) return;
  const head=norm(Math.atan2(fx,fy)/D2R), elev=Math.atan2(fz,horiz)/D2R;
  if(S.yaw0==null) S.yaw0=norm(S.bear-head);
  S.bear=norm(head+S.yaw0+S.dragYaw);
  S.pitch=clamp(90+elev,70,85);
}
let drag=null;
$('#map').addEventListener('pointerdown',e=>{ if(S.busy) return; drag={x:e.clientX,y:e.clientY,id:e.pointerId}; try{$('#map').setPointerCapture(e.pointerId);}catch(_){} });
$('#map').addEventListener('pointermove',e=>{ if(!drag||e.pointerId!==drag.id) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
  const k=-.28; if(S.sensor&&S.yaw0!=null) S.dragYaw+=dx*k; else S.bear=norm(S.bear+dx*k);
  if(!S.sensor) S.pitch=clamp(S.pitch+dy*.08,70,85); });
const endDrag=()=>{drag=null}; $('#map').addEventListener('pointerup',endDrag); $('#map').addEventListener('pointercancel',endDrag);

/* ---------- 往前走 ---------- */
const walk=$('#walk');
walk.addEventListener('pointerdown',e=>{ e.preventDefault(); if(S.busy) return; askPerm(); S.walking=true; walk.classList.add('on'); try{walk.setPointerCapture(e.pointerId);}catch(_){} });
const stopWalk=()=>{ S.walking=false; walk.classList.remove('on'); };
['pointerup','pointercancel','lostpointercapture'].forEach(n=>walk.addEventListener(n,stopWalk));
walk.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{ if(e.repeat) return; if(e.key==='ArrowUp'||e.key==='w'){S.walking=true;walk.classList.add('on');} if(e.key==='ArrowLeft') S.bear-=8; if(e.key==='ArrowRight') S.bear+=8; });
window.addEventListener('keyup',e=>{ if(e.key==='ArrowUp'||e.key==='w') stopWalk(); });

/* ---------- 快門：按住集氣 0.8 秒，放開拍 ---------- */
const shut=$('#shut'); let chargeT0=0;
shut.addEventListener('pointerdown',e=>{ e.preventDefault(); askPerm(); if(S.busy) return;
  if(!S.near){ toast(`再走近 ${Math.max(1,Math.round(tDist())-REACH)} m`); buzz(15); return; }
  S.charging=true; chargeT0=performance.now(); shut.classList.add('charging'); sfx.chargeStart(); buzz(10); try{shut.setPointerCapture(e.pointerId);}catch(_){} });
function releaseShut(){ if(!S.charging) return; S.charging=false; sfx.chargeStop(); shut.classList.remove('charging','full'); const full=S.charge>=1; S.charge=0; shut.style.setProperty('--p',0);
  if(full) capture(); else toast('按住集滿再放開'); }
shut.addEventListener('pointerup',releaseShut); shut.addEventListener('pointercancel',()=>{S.charging=false;sfx.chargeStop();shut.classList.remove('charging','full');S.charge=0;shut.style.setProperty('--p',0);});
shut.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- 收集 ---------- */
function snap(){ // 天空漸層＋地圖畫面，裁成 2:3 卡面
  const mc=map.getCanvas(), W=mc.width, H=mc.height;
  const t=S.target, p=toXY(t.lat,t.lng), s=proj(p.x,p.y,treeH(t)*.45), k=W/app.clientWidth;
  const cw=Math.round(Math.min(W,H/1.5)*.96), ch=Math.round(cw*1.5);
  const sx=clamp(Math.round(s.x*k-cw/2),0,W-cw), sy=clamp(Math.round(s.y*k-ch*.5),0,Math.max(0,H-ch));
  const c=document.createElement('canvas'); c.width=Math.round(cw*640/ch); c.height=640;
  const g=c.getContext('2d'), sc=c.height/ch;
  const gr=g.createLinearGradient(0,0,0,c.height); gr.addColorStop(0,'#6cc8ff'); gr.addColorStop(.6,'#c9ecff'); gr.addColorStop(1,'#e9f7ff');
  g.fillStyle=gr; g.fillRect(0,0,c.width,c.height);
  try{ g.drawImage(mc,sx,sy,cw,Math.min(ch,H-sy),0,0,c.width,Math.min(ch,H-sy)*sc); }catch(e){}
  return c;
}
function capture(){
  const t=S.target; if(!t||S.busy) return; S.busy=true; stopWalk(); app.classList.add('busy');
  const photo=snap();
  sfx.shutter(); buzz([20,30,40]);
  $('#flash').animate([{opacity:.95},{opacity:0}],{duration:360,easing:'ease-out'});
  const k=rarOf(t), sp=spOf(t), first=t.days<0, pts=ptsOf(t)+(sp?SP_BONUS:0);
  const card=$('#card'); card.style.setProperty('--rc',RC[k]); if(sp) card.style.setProperty('--sc',sp.c);
  const ph=card.querySelector('.ph'); ph.querySelectorAll('canvas').forEach(x=>x.remove()); ph.prepend(photo);
  card.querySelector('.rk').textContent=RAR[k].n;
  const spn=card.querySelector('.spn'); spn.innerHTML=sp?logo(sp):''; spn.style.display=sp?'grid':'none';
  card.querySelector('h3').textContent=t.species; card.querySelector('.pt').textContent='+'+pts;
  card.querySelector('.id').textContent=`${t.id}・胸徑 ${t.dbh} cm`;
  card.querySelector('.bd').innerHTML='<span class="pill">模擬</span>'+(sp?`<span class="pill" style="background:#fff;border:2px solid ${sp.c};color:${sp.c}">${sp.name} 贊助</span><span class="pill">虛構</span>`:'');
  $('#rays').style.setProperty('--rc',RC[k]);
  record(t,pts);
  setTimeout(()=>{
    $('#dim').classList.add('show'); card.style.display='block'; card.classList.remove('settled'); void card.offsetWidth; card.classList.add('show');
    sfx.flash(); $('#mk').style.display='none';
    setTimeout(()=>{
      card.classList.add('settled'); $('#rays').classList.add('show'); sfx.reveal(first); buzz(first?[30,40,30,40,90]:[30,50,60]);
      const r=card.getBoundingClientRect(), a=app.getBoundingClientRect();
      burstStars(r.left-a.left+r.width/2,r.top-a.top+r.height*.4,RC[k],first);
      const gain=$('#gain');
      gain.innerHTML=`<div class="big">${first?'從沒人拍過':t.days+' 天沒人拍'}　<b>+${ptsOf(t)}</b></div>`+(sp?`<span class="sp" style="--sc:${sp.c}"><i>${logo(sp)}</i>${sp.name} 贊助 +${SP_BONUS}<span class="pill">虛構</span></span>`:'');
      gain.style.top=(r.bottom-a.top+14)+'px'; gain.classList.add('show');
      setTimeout(()=>{ $('#done').classList.add('show'); sfx.ding(); },450);
    },700);
  },260);
}
function record(t,pts){
  S.collected.add(t.id);
  store.set('points',(Number(store.get('points',0))||0)+pts);
  let mine=store.get('collect',[]); if(!Array.isArray(mine)) mine=[];
  mine.push({id:t.id,species:t.species,place:t.place,rarity:RAR[rarOf(t)].n,pts,at:Date.now(),sim:true,twin:true});
  store.set('collect',mine.slice(-300)); updPts();
  const ptn=$('#pts'); ptn.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:500,delay:900,easing:'cubic-bezier(.2,1.6,.3,1)'});
}
function endCapture(){
  ['#dim','#rays','#gain','#done'].forEach(s=>$(s).classList.remove('show')); const card=$('#card'); card.classList.remove('show','settled'); card.style.display='none';
  S.busy=false; app.classList.remove('busy');
}
$('#again').onclick=()=>{ const old=S.target; endCapture(); setTreeData();
  const t=nextTarget(S.u.x,S.u.y,old&&old.id); setTarget(t,true); toast(`下一棵：${t.species}`); };

/* ---------- 星星粒子 ---------- */
const fx=$('#fx'), xctx=fx.getContext('2d'); let stars=[], DPR=1;
function resizeFx(){ DPR=Math.min(2,devicePixelRatio||1); fx.width=app.clientWidth*DPR; fx.height=app.clientHeight*DPR; }
resizeFx(); addEventListener('resize',()=>{resizeFx(); lastCam='';});
function burstStars(x,y,col,big){ const cols=[col,'#ffffff','#ffcd2e','#9bdc6e','#6cc8ff']; const n=reduce?10:(big?70:40);
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=3+Math.random()*(big?11:8); stars.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,r:3+Math.random()*6,c:cols[i%cols.length],life:1,rot:Math.random()*6}); } }
function star(c,x,y,R,rot){ c.beginPath(); for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2, rr=i%2?R*.45:R; c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);} c.closePath(); }
function drawStars(dt){ if(!stars.length&&!drawStars.dirty) return; const c=xctx; c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,fx.width,fx.height); drawStars.dirty=stars.length>0; const k=Math.min(3,dt*60);
  stars=stars.filter(s=>s.life>0); for(const s of stars){ s.x+=s.vx*k; s.y+=s.vy*k; s.vy+=.35*k; s.vx*=.985; s.life-=.012*k; s.rot+=.1*k; c.globalAlpha=Math.max(0,s.life); c.fillStyle=s.c; star(c,s.x,s.y,s.r,s.rot); c.fill(); } c.globalAlpha=1; }

/* ---------- 每幀 ---------- */
const mk=$('#mk'), intro=$('#intro');
let last=performance.now();
function loop(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  if(S.ready&&!S.busy){
    sensorView();
    if(S.walking){ const B=S.bear*D2R; const nx=S.u.x+Math.sin(B)*SPEED*dt, ny=S.u.y+Math.cos(B)*SPEED*dt; if(clearAt(nx,ny,.4)){S.u.x=nx;S.u.y=ny;}
      if(now-S.lastStep>480){ S.lastStep=now; sfx.step(now/480|0); } }
    if(S.charging){ S.charge=Math.min(1,(now-chargeT0)/800); shut.style.setProperty('--p',S.charge); if(S.charge>=1&&!shut.classList.contains('full')){ shut.classList.add('full'); sfx.full(); buzz(30);} }
    applyCam(); updGoal();
    // 目標標記（DOM，便宜）
    const t=S.target;
    if(t){ const p=toXY(t.lat,t.lng), h=treeH(t), s=proj(p.x,p.y,h+.6), W=app.clientWidth, H=app.clientHeight;
      let x=s.x, y=s.y, edge=false;
      if(s.depth<=.5||x<20||x>W-20){ edge=true; const right=s.depth<=.5?((((Math.atan2(p.x-S.u.x,p.y-S.u.y)/D2R-S.bear)%360)+540)%360-180)>0:x>W/2; x=right?W-26:26; y=H*.5; }
      y=clamp(y,300,H-170);
      mk.style.display='block'; mk.classList.toggle('edge',edge); mk.style.transform=`translate(${x}px,${y}px)`;
      const age=now-S.intro;
      if(age<2000&&!edge){ const g=proj(p.x,p.y,h*.6); intro.style.display='block'; intro.style.transform=`translate(${clamp(g.x,90,W-90)}px,${clamp(g.y,360,H-190)}px)`; }
      else intro.style.display='none';
    }
  }
  drawStars(dt);
  requestAnimationFrame(loop);
}

map.on('load',async()=>{
  try{ await loadAll(); }catch(e){ console.error(e); $('#load').textContent='孿生資料載入失敗'; return; }
  setGlow(false); S.near=null; updGoal(true);
  S.ready=true; applyCam();
  map.once('idle',()=>{ $('#load').classList.add('gone'); S.intro=performance.now(); });
  setTimeout(()=>$('#load').classList.add('gone'),4000);
});
requestAnimationFrame(loop);
</script>
