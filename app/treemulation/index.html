<style>
:root{
  --sky:#6cc8ff; --sky2:#c9ecff; --grass:#9bdc6e; --grass2:#7cc653; --leaf:#2e9e5b; --navy:#17405e; --sun:#ffcd2e; --sun2:#e8a300;
  --card:#fff; --mute:#5d7f97; --line:#e3eef5;
  --round:"Huninn","M PLUS Rounded 1c","Noto Sans TC",system-ui,sans-serif; --num:"Fredoka","Huninn",sans-serif;
  --vh:1vh;
}
@supports (height:1dvh){:root{--vh:1dvh}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#dff3ff;color:var(--navy);font-family:var(--round);-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:flex-start;justify-content:center}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.phone{position:relative;width:100%;max-width:430px;height:100vh;height:calc(100 * var(--vh));overflow:hidden;
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 34%,#eef9ff 64%,#f4fbf0 100%);
  padding:calc(clamp(8px, 1.6 * var(--vh), 14px) + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:clamp(8px, 1.6 * var(--vh), 14px)}
@media (min-width:520px) and (min-height:700px){
  body{align-items:center}
  .phone{width:390px;height:min(844px, calc(100 * var(--vh) - 24px));border-radius:40px;box-shadow:0 30px 80px #17405e40,0 0 0 8px #fff}
}
.pill{display:inline-flex;align-items:center;font:700 11px/1 var(--round);padding:4px 8px;border-radius:99px;white-space:nowrap}
.pill.sim{background:#fff3c4;color:#8a6a00}

/* 頂部膠囊 */
.stats{flex:none;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:clamp(36px, 5.6 * var(--vh), 44px);padding:0 13px 0 5px;background:#fff;border-radius:99px;box-shadow:0 4px 0 #17405e1c}
.chip svg{height:78%;aspect-ratio:1;flex:none}
.chip b{font:700 clamp(18px, 2.8 * var(--vh), 22px)/1 var(--num);font-variant-numeric:tabular-nums}
.chip span{font:800 13px var(--round);color:var(--mute)}
.stats .pill{margin-left:auto}

/* 品牌 */
.brand{flex:none;display:flex;align-items:center;gap:12px;height:clamp(60px, 11 * var(--vh), 92px);padding:0 2px}
.mark{height:100%;aspect-ratio:1;flex:none;filter:drop-shadow(0 5px 0 #17405e22)}
.mark .spark{transform-origin:352px 164px;animation:twinkle 1.2s cubic-bezier(.3,1.8,.5,1) .25s both}
@keyframes twinkle{0%{transform:scale(0) rotate(-90deg)}100%{transform:none}}
.word h1{font:400 clamp(38px, 7.2 * var(--vh), 58px)/1 "Huninn",var(--round);letter-spacing:.04em;color:var(--navy);text-shadow:0 3px 0 #fff}
.word p{font:600 clamp(14px, 2.3 * var(--vh), 19px)/1 var(--num);letter-spacing:.06em;color:#fff;margin-top:clamp(3px, .8 * var(--vh), 7px);text-shadow:0 2px 0 #3b9fd8}

/* 入口 */
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
.row.big{flex:1.75 1 0}
.row.small{flex:1 1 0;max-height:150px;padding-bottom:7px}
.big{padding-bottom:7px}
.door{position:relative;min-height:0;display:flex;flex-direction:column;border-radius:clamp(22px, 3.4 * var(--vh), 30px);padding:clamp(10px, 1.8 * var(--vh), 16px) clamp(12px, 3.4vw, 16px);overflow:hidden;transition:transform .08s}
.door:active{transform:translateY(4px)}
.door h2{white-space:nowrap;font:400 min(clamp(26px, 4.6 * var(--vh), 38px), 8.4vw)/1.1 "Huninn",var(--round);letter-spacing:.04em}
.door p{font:800 clamp(12px, 1.9 * var(--vh), 15px)/1.3 var(--round);margin-top:3px}
.door .art{flex:1 1 0;min-height:0;width:100%;display:block;margin-bottom:clamp(4px, 1 * var(--vh), 10px)}

.d-collect{background:linear-gradient(165deg,#b2e889 0%,var(--grass2) 75%);box-shadow:0 7px 0 #5aa637,0 14px 26px #5aa63740}
.d-wish{background:linear-gradient(165deg,#a6ddff 0%,#58b8f0 80%);box-shadow:0 7px 0 #3496d0,0 14px 26px #3496d040}

.small .door{justify-content:flex-end}
.small .door .art{position:absolute;right:clamp(8px, 2.4vw, 12px);top:clamp(8px, 1.4 * var(--vh), 12px);width:auto;height:min(60px, 48%);aspect-ratio:1;margin:0}
.small .door h2{font-size:clamp(20px, 3.3 * var(--vh), 26px)}
.small .door p{font-size:clamp(11px, 1.8 * var(--vh), 14px)}
.d-redeem{background:var(--sun);box-shadow:0 7px 0 var(--sun2),0 12px 22px #e8a30033}
.d-dex{background:#fff;box-shadow:0 7px 0 #c6dce9,0 12px 22px #17405e14}
.d-dex p b{font:700 1.1em var(--num)}

.foot{flex:none;text-align:center;font:800 13px var(--round);color:var(--mute)}
.foot a{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px}
.foot a:hover{background:#ffffffaa}
.foot{display:flex;justify-content:center;gap:8px;align-items:center}.foot .vote{background:var(--sun,#ffcd2e);color:var(--navy,#17405e);box-shadow:0 3px 0 #e8a300}
.foot svg{width:16px;height:16px}

@media (prefers-reduced-motion:reduce){.mark .spark{animation:none}.door{transition:none}}
</style>

<script>
(function(){
  function get(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
  var p=Number(get('tt.points',0));if(!isFinite(p)||p<0)p=0;p=Math.round(p);
  var c=get('tt.collect',[]);var n=Array.isArray(c)?c.length:0;
  document.getElementById('cnt').textContent=n;
  document.getElementById('cnt2').textContent=n;
  var el=document.getElementById('pts');
  var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(still||p===0){el.textContent=p.toLocaleString('zh-TW');}
  else{var t0=null;requestAnimationFrame(function step(t){if(!t0)t0=t;var k=Math.min(1,(t-t0)/700);el.textContent=Math.round(p*(1-Math.pow(1-k,3))).toLocaleString('zh-TW');if(k<1)requestAnimationFrame(step);});}
})();
</script>
